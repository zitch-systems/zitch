<script>
  // Show the coil straight away, then fade it out the moment the app has rendered.
  (function () {
    var boot = document.getElementById('zboot'), root = document.getElementById('root');
    var loader = window.ZitchLoader && window.ZitchLoader.mount(document.getElementById('zboot-coil'), { height: 196, shadow: true, label: 'Loading Zitch' });
    function done() {
      if (!boot || boot.className === 'out') return;
      boot.className = 'out';
      setTimeout(function () { if (loader) loader.destroy(); if (boot.parentNode) boot.parentNode.removeChild(boot); }, 400);
    }
    if (root.childNodes.length) return done();
    var mo = new MutationObserver(function () { if (root.childNodes.length) { mo.disconnect(); done(); } });
    mo.observe(root, { childList: true });
  })();
</script>
