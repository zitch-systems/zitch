<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Face check · Zitch</title>
  {% include "whatsapp/_bank_styles.html" %}
  <style nonce="{{ nonce }}">
    .stage { position: relative; width: 240px; height: 240px; margin: 18px auto 6px; border-radius: 50%; overflow: hidden; border: 4px solid #14583d; background: #0b1f1a; }
    .stage video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .prompt { text-align: center; font-size: 20px; font-weight: 700; margin: 14px 0 4px; min-height: 28px; }
    .count { text-align: center; font-size: 15px; color: #52665c; min-height: 22px; }
    .done { text-align: center; font-size: 18px; font-weight: 700; color: #14583d; }
  </style>
</head>
<body>
<main>
  <div class="brand">zitch</div>
  <h1>Face check</h1>
  {% if valid %}
  <section class="card">
    <div class="stage" id="stage" hidden><video id="video" playsinline autoplay muted></video></div>
    <p class="prompt" id="prompt">Face the camera in good light.</p>
    <p class="count" id="count"></p>
    <p class="message" id="message" role="status" hidden></p>
    <button type="button" id="start">Start face check</button>
  </section>
  {% else %}
  <section class="card"><p class="notice">This link has expired. Go back to the Zitch app and tap “Verify your face” again.</p></section>
  {% endif %}
</main>
{% if valid %}
<script nonce="{{ nonce }}">
(function () {
  "use strict";
  var steps = [["straight", "Look straight at the camera"], ["left", "Slowly turn your head to the left"], ["right", "Now turn your head to the right"]];
  var video = document.getElementById("video"), stage = document.getElementById("stage");
  var prompt = document.getElementById("prompt"), count = document.getElementById("count");
  var message = document.getElementById("message"), start = document.getElementById("start");
  var stream = null;
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var show = function (text) { message.textContent = text; message.hidden = !text; };
  var stop = function () { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; };
  var grab = function () {
    var scale = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  };
  var run = async function () {
    show(""); start.disabled = true; start.hidden = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 } }, audio: false });
    } catch (e) {
      show("Allow camera access to continue, then try again."); start.hidden = false; start.disabled = false; return;
    }
    video.srcObject = stream; stage.hidden = false;
    await new Promise(function (r) { if (video.readyState >= 2) r(); else video.onloadeddata = r; });
    var frames = {};
    for (var i = 0; i < steps.length; i += 1) {
      prompt.textContent = steps[i][1];
      for (var s = 3; s > 0; s -= 1) { count.textContent = String(s); await wait(800); }
      count.textContent = "";
      frames[steps[i][0]] = grab();
    }
    prompt.textContent = "Checking…";
    try {
      var response = await fetch("{{ submit_url|escapejs }}", { method: "POST", headers: { "Content-Type": "application/json" },
        credentials: "omit", body: JSON.stringify({ frames: frames }) });
      var body = await response.json().catch(function () { return {}; });
      stop();
      if (response.ok && body.success) {
        stage.hidden = true; prompt.className = "done";
        prompt.textContent = "Face verified. Go back to the Zitch app to finish your upgrade.";
        return;
      }
      prompt.textContent = "Face the camera in good light."; show(body.message || "We could not check your face. Please try again.");
    } catch (e) {
      stop(); prompt.textContent = "Face the camera in good light."; show("Connection interrupted. Please try again.");
    }
    stage.hidden = true; start.textContent = "Try again"; start.hidden = false; start.disabled = false;
  };
  start.addEventListener("click", function () { void run(); });
})();
</script>
{% endif %}
</body>
</html>
