<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Face verification · Zitch</title>
  {% include "whatsapp/_bank_styles.html" %}
</head>
<body>
<main>
  <div class="brand">zitch</div>
  <h1>Verify your face</h1>
  {% if message %}<p class="message" role="status">{{ message }}</p>{% endif %}

  <section class="card">
    <a class="back" href="{{ path }}">← Back to your details</a>
    <h2>Before you start</h2>
    <ul class="tips">
      <li>Face the camera in good light</li>
      <li>Remove glasses, hats and face coverings</li>
      <li>Keep your whole face inside the frame</li>
    </ul>
    <form id="face-form" method="post" action="{{ path }}" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="hidden" name="action" value="face">
      <canvas id="face-preview" width="360" height="360" role="img" aria-label="Your photo" hidden></canvas>
      <label class="camera" for="face"><span id="face-cta">Open camera</span></label>
      <input id="face" name="face" type="file" accept="image/jpeg,image/png" capture="user" class="visually-hidden">
      <button type="submit" id="face-submit">Verify my face</button>
    </form>
  </section>

</main>
<script nonce="{{ nonce }}">
(function () {
  "use strict";
  document.documentElement.classList.add("js");
  var form = document.getElementById("face-form");
  var face = document.getElementById("face");
  var preview = document.getElementById("face-preview");
  var cta = document.getElementById("face-cta");
  var submit = document.getElementById("face-submit");
  submit.disabled = true;

  // Phone cameras produce multi-megabyte photos: send a JPEG of at most
  // 1280px, and preview it by drawing the decoded image, never by linking it.
  var shrink = function (file, done) {
    if (!file || !/^image\//.test(file.type)) { done(null); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      var side = Math.min(img.naturalWidth, img.naturalHeight);
      var view = preview.getContext("2d");
      view.clearRect(0, 0, preview.width, preview.height);
      view.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side,
        0, 0, preview.width, preview.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        done(blob ? new File([blob], "face.jpg", { type: "image/jpeg" }) : null);
      }, "image/jpeg", 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  };
  face.addEventListener("change", function () {
    var file = face.files && face.files[0];
    if (!file) { submit.disabled = true; preview.hidden = true; return; }
    cta.textContent = "Preparing photo…";
    shrink(file, function (small) {
      if (small && window.DataTransfer) {
        try { var list = new DataTransfer(); list.items.add(small); face.files = list.files; } catch (e) { /* keep the original */ }
      }
      preview.hidden = !small;
      cta.textContent = "Retake photo";
      submit.disabled = false;
    });
  });
  form.addEventListener("submit", function (event) {
    if (!(face.files && face.files.length)) { event.preventDefault(); face.click(); return; }
    window.setTimeout(function () { submit.disabled = true; submit.textContent = "Verifying…"; }, 0);
  });
})();
</script>
</body>
</html>
