<style nonce="{{ nonce }}">
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #f4f6f2; color: #142621; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    .brand { font-weight: 800; letter-spacing: -.04em; font-size: 26px; color: #14583d; }
    .eyebrow { font-size: 13px; color: #52665c; margin: 2px 0 0; }
    h1 { font-size: 26px; line-height: 1.2; margin: 18px 0 6px; }
    h2 { font-size: 18px; line-height: 1.3; margin: 0 0 4px; }
    .lead { color: #3c5149; margin: 0 0 6px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; margin: 14px 0; box-shadow: 0 1px 2px rgba(20, 38, 33, .06); }
    label, legend { display: block; font-weight: 600; font-size: 15px; margin-top: 16px; }
    fieldset { border: 0; padding: 0; margin: 16px 0 0; min-width: 0; }
    legend { padding: 0; }
    fieldset > legend { margin-top: 0; }
    input:not([type=radio]):not(.visually-hidden) { width: 100%; border: 1px solid #b9c6bf; border-radius: 12px; padding: 13px 14px; margin-top: 6px; font: inherit; background: #fff; color: inherit; }
    input.file { padding: 10px; font-size: 14px; }
    input[readonly] { background: #f1f4f2; color: #52665c; }
    input:focus, button:focus, a:focus-visible, .camera:focus-within, .segmented input:focus-visible + span, .option input:focus-visible + span { outline: 3px solid #acdfaa; outline-offset: 2px; }
    .hint { font-size: 13.5px; color: #52665c; margin: 6px 0 0; font-weight: 400; }
    .segmented { display: flex; gap: 8px; margin-top: 8px; }
    .segmented label { flex: 1; margin: 0; }
    .segmented input, .option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .segmented span { display: block; text-align: center; padding: 12px 8px; border: 1.5px solid #b9c6bf; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .segmented input:checked + span { background: #14583d; border-color: #14583d; color: #fff; }
    .options { display: grid; gap: 10px; margin-top: 10px; }
    .options.two { grid-template-columns: 1fr 1fr; }
    .option { margin: 0; font-weight: 400; }
    .option span { display: block; height: 100%; padding: 14px 16px; border: 1.5px solid #b9c6bf; border-radius: 14px; cursor: pointer; }
    .option strong { display: block; font-size: 15.5px; }
    .option small { display: block; color: #52665c; font-size: 14px; margin-top: 2px; }
    .option input:checked + span { border-color: #14583d; background: #eaf4ee; box-shadow: inset 0 0 0 1px #14583d; }
    button { width: 100%; min-height: 50px; border: 0; border-radius: 14px; padding: 14px; margin-top: 20px; background: #14583d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { background: #fff; color: #14583d; border: 1.5px solid #14583d; margin-top: 10px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .notice { background: #fff5de; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
    .message { background: #e3f1e8; border-radius: 12px; padding: 12px 14px; }
    .tips { margin: 10px 0 0; padding-left: 20px; color: #3c5149; }
    .camera { display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1.5px dashed #14583d; border-radius: 14px; color: #14583d; margin-top: 16px; cursor: pointer; font-weight: 700; }
    #face-preview { display: block; width: 180px; height: 180px; border-radius: 50%; margin: 16px auto 0; border: 3px solid #14583d; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .idcard:has(input[name=kind][value=bvn]:checked) #nimc-field { display: none; }
    details > summary { cursor: pointer; color: #14583d; font-weight: 700; margin-top: 14px; }
    .privacy { font-size: 13px; color: #52665c; margin-top: 20px; }
    a.button { display: block; text-align: center; text-decoration: none; min-height: 50px; border-radius: 14px; padding: 14px; margin-top: 16px; background: #14583d; color: #fff; font-weight: 700; }
    a.back, button.back { display: inline-block; width: auto; min-height: 0; background: none; color: #14583d; padding: 4px 0; margin: 0 0 10px; font-weight: 700; text-decoration: none; }
    .step { font-size: 13px; font-weight: 700; color: #52665c; letter-spacing: .02em; margin: 0 0 4px; }
    .js #id-step { display: none; }
    .js .on-id #id-step { display: block; }
    .js .on-id #details-step { display: none; }
</style>
