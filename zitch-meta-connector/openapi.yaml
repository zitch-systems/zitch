openapi: 3.1.0
info:
  title: Zitch Meta Connector
  version: "1.0.0"
  description: >
    Maintenance and configuration tools for the Zitch WhatsApp Cloud API and
    Meta Business API. This is the REST mirror of the connector's MCP tools
    (see /mcp), provided so the same logic can be wired up as a ChatGPT GPT
    Action without re-implementing anything.

    GET endpoints are reads. POST endpoints are CONFIG WRITES and are only
    present when the connector is deployed with META_ALLOW_WRITES enabled;
    each requires a `confirm` field restating the exact resource it changes.

    No endpoint can send a WhatsApp message, change a webhook subscription,
    register a phone number, or rotate a token. None can reach a Zitch
    customer's PIN, biometric enrollment, balance, transaction history, or
    personal data - this connector only ever talks to the Meta Graph API,
    never the Zitch backend or database.
servers:
  - url: https://REPLACE_WITH_YOUR_DEPLOYED_HOST/rest
    description: Production (replace with your actual deployment host)
  - url: http://localhost:8787/rest
    description: Local development

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /:
    get:
      operationId: listTools
      summary: List available tools
      description: Returns the name, REST path, and description of every tool this connector exposes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
                        description: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /check-whatsapp-webhook-status:
    get:
      operationId: checkWhatsAppWebhookStatus
      summary: Check WhatsApp webhook status
      description: >
        Reports which app(s) are subscribed to the WhatsApp Business Account's
        webhook events and which event fields each is subscribed to.
      parameters:
        - $ref: "#/components/parameters/WabaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookStatusResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /check-whatsapp-phone-number-config:
    get:
      operationId: checkWhatsAppPhoneNumberConfig
      summary: Check WhatsApp phone-number configuration
      description: Reads Zitch's own outbound WhatsApp number configuration.
      parameters:
        - name: phoneNumberId
          in: query
          required: false
          description: Phone number ID to inspect. Defaults to META_PHONE_NUMBER_ID.
          schema: { type: string, pattern: "^\\d{1,32}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneNumberConfigResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /list-whatsapp-message-templates:
    get:
      operationId: listWhatsAppMessageTemplates
      summary: List WhatsApp message templates
      description: Lists the WABA's message templates with approval status, category, language, and quality score.
      parameters:
        - $ref: "#/components/parameters/WabaId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: after
          in: query
          required: false
          description: Opaque pagination cursor from a previous response.
          schema: { type: string, maxLength: 2048 }
        - name: nameFilter
          in: query
          required: false
          description: Case-sensitive exact template name to filter on.
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplatesResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /inspect-failed-message-deliveries:
    get:
      operationId: inspectFailedMessageDeliveries
      summary: Inspect failed message deliveries
      description: >
        Aggregate daily sent/delivered counts for a bounded recent window.
        Meta's Graph API does not expose a per-message failure log — see the
        response's `note` field for the exact limitation.
      parameters:
        - $ref: "#/components/parameters/WabaId"
        - name: lookbackHours
          in: query
          required: false
          description: How far back to look, in hours (1-720). Defaults to 24.
          schema: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailedDeliveriesResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /inspect-webhook-events:
    get:
      operationId: inspectWebhookEvents
      summary: Inspect webhook event configuration
      description: >
        Lists which webhook event types (fields) are currently configured per
        subscribed app. This is current configuration, not a historical
        delivery log — see the response's `note` field for the exact
        limitation.
      parameters:
        - $ref: "#/components/parameters/WabaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEventsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /verify-meta-credentials:
    get:
      operationId: verifyMetaCredentials
      summary: Verify Meta API credentials
      description: >
        Confirms META_ACCESS_TOKEN is valid and can read the configured WABA
        and phone number. Never returns the token itself.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyCredentialsResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /list-whatsapp-flows:
    get:
      operationId: listWhatsAppFlows
      summary: List WhatsApp Flows
      description: >
        The WABA's Flows (interactive multi-screen forms) with publish status
        and categories. Distinct from message templates.
      parameters:
        - $ref: "#/components/parameters/WabaId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowsListResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /inspect-whatsapp-flow:
    get:
      operationId: inspectWhatsAppFlow
      summary: Inspect a WhatsApp Flow
      description: >
        One Flow's status, categories and validation_errors (what Meta refuses
        a publish on), plus its existing preview URL.
      parameters:
        - name: flowId
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{1,32}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowDetailResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /get-published-flow-screens:
    get:
      operationId: getPublishedFlowScreens
      summary: Get a published Flow's screens and routing
      description: >
        Screen inventory and routing model of the Flow JSON Meta has actually
        published, including routing roots (the only screens a Flow may open
        on), dangling routes and unreachable screens. The full Flow JSON is
        deliberately not returned - it embeds the logo as base64.
      parameters:
        - name: flowId
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{1,32}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowScreensResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /get-waba-details:
    get:
      operationId: getWabaDetails
      summary: Get WhatsApp Business Account details
      description: Account name, timezone, template namespace, review and verification status.
      parameters:
        - $ref: "#/components/parameters/WabaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wabaId: { type: string }
                  name: { type: string }
                  timezoneId: { type: string }
                  messageTemplateNamespace: { type: string }
                  accountReviewStatus: { type: string }
                  businessVerificationStatus: { type: string }
                  ownershipType: { type: string }
                  currency: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /list-whatsapp-phone-numbers:
    get:
      operationId: listWhatsAppPhoneNumbers
      summary: List WhatsApp phone numbers
      description: Every number on the WABA with quality rating, verification and messaging tier.
      parameters:
        - $ref: "#/components/parameters/WabaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wabaId: { type: string }
                  phoneNumbers:
                    type: array
                    items: { $ref: "#/components/schemas/PhoneNumberConfigResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /get-whatsapp-business-profile:
    get:
      operationId: getWhatsAppBusinessProfile
      summary: Get the public WhatsApp business profile
      description: The profile customers see on the business. Business-authored content, not customer data.
      parameters:
        - name: phoneNumberId
          in: query
          required: false
          schema: { type: string, pattern: "^\\d{1,32}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  phoneNumberId: { type: string }
                  about: { type: string }
                  address: { type: string }
                  description: { type: string }
                  email: { type: string }
                  websites: { type: array, items: { type: string } }
                  vertical: { type: string }
                  profilePictureUrl: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /get-conversation-analytics:
    get:
      operationId: getConversationAnalytics
      summary: Get conversation volume and cost
      description: >
        Aggregate conversation counts and billing over a bounded window,
        grouped by category. Aggregate totals only - no recipients, no message
        content, no per-customer detail.
      parameters:
        - $ref: "#/components/parameters/WabaId"
        - name: lookbackHours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wabaId: { type: string }
                  windowHours: { type: integer }
                  totals:
                    type: object
                    properties:
                      conversations: { type: integer }
                      cost: { type: number }
                  byCategory:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        conversations: { type: integer }
                        cost: { type: number }
                  dataPoints: { type: integer }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }

  /create-message-template:
    post:
      operationId: createMessageTemplate
      summary: Create a message template
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Submits a new template to Meta for review. `confirm` must equal the template name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - name
                  - language
                  - category
                  - components
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /update-message-template:
    post:
      operationId: updateMessageTemplate
      summary: Edit a message template
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Edits a template's components or category; sends approved templates back to review. `confirm` must equal templateId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - templateId
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /delete-message-template:
    post:
      operationId: deleteMessageTemplate
      summary: Delete a message template
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Deletes a template by name, removing EVERY language version. `confirm` must equal the template name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - name
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /update-whatsapp-business-profile:
    post:
      operationId: updateWhatsAppBusinessProfile
      summary: Update the public business profile
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Updates about/address/description/email/vertical/websites. `confirm` must equal the phone number ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /create-whatsapp-flow:
    post:
      operationId: createWhatsAppFlow
      summary: Create a WhatsApp Flow
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Creates a new empty Flow in draft. `confirm` must equal the Flow name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - name
                  - categories
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /update-whatsapp-flow-json:
    post:
      operationId: updateWhatsAppFlowJson
      summary: Replace a Flow's draft JSON
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Uploads a Flow JSON document, replacing the draft. Does not go live until published. `confirm` must equal flowId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - flowId
                  - flowJson
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /publish-whatsapp-flow:
    post:
      operationId: publishWhatsAppFlow
      summary: Publish a WhatsApp Flow
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. Makes the Flow live for customers. `confirm` must equal flowId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - flowId
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
  /deprecate-whatsapp-flow:
    post:
      operationId: deprecateWhatsAppFlow
      summary: Deprecate a WhatsApp Flow
      description: >
        WRITE. Only present when the connector is deployed with
        META_ALLOW_WRITES enabled. IRREVERSIBLE. No new session can open on this Flow afterwards. `confirm` must equal flowId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                  - flowId
                  - confirm
              properties:
                confirm:
                  type: string
                  description: >
                    Safety interlock - must exactly equal the name or ID of the
                    resource being changed, or the call is refused.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: Called with GET. Write endpoints require POST.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaApiError" }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Connector-Api-Key
    BearerAuth:
      type: http
      scheme: bearer
      description: CONNECTOR_API_KEY as a Bearer token. Required on every request.

  parameters:
    WabaId:
      name: wabaId
      in: query
      required: false
      description: WhatsApp Business Account ID. Defaults to META_WABA_ID.
      schema: { type: string, pattern: "^\\d{1,32}$" }

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: invalid_input }
              message: { type: string }
    Unauthorized:
      description: Missing or invalid CONNECTOR_API_KEY.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unauthorized }
              message: { type: string }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: rate_limited }
              message: { type: string }
    MetaApiError:
      description: The Meta Graph API returned an error or was unreachable.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: meta_api_error }
              message: { type: string }

  schemas:
    WebhookStatusResult:
      type: object
      properties:
        wabaId: { type: string }
        subscribed: { type: boolean }
        subscribedApps:
          type: array
          items:
            type: object
            properties:
              appName: { type: string }
              subscribedFields:
                type: array
                items: { type: string }

    PhoneNumberConfigResult:
      type: object
      properties:
        phoneNumberId: { type: string }
        displayPhoneNumber: { type: string }
        verifiedName: { type: string }
        codeVerificationStatus: { type: string }
        qualityRating: { type: string }
        messagingLimitTier: { type: string }
        platformType: { type: string }
        isOfficialBusinessAccount: { type: boolean }
        nameStatus: { type: string }

    MessageTemplatesResult:
      type: object
      properties:
        wabaId: { type: string }
        nextCursor: { type: string }
        templates:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              category: { type: string }
              language: { type: string }
              qualityScore: { type: string }
              rejectedReason: { type: string }

    FailedDeliveriesResult:
      type: object
      properties:
        wabaId: { type: string }
        windowHours: { type: integer }
        granularity: { type: string }
        note: { type: string }
        dailyBreakdown:
          type: array
          items:
            type: object
            properties:
              periodStart: { type: string, format: date-time }
              periodEnd: { type: string, format: date-time }
              sent: { type: integer }
              delivered: { type: integer }
              undeliveredApprox: { type: integer }

    WebhookEventsResult:
      type: object
      properties:
        wabaId: { type: string }
        note: { type: string }
        configuredEventTypes:
          type: array
          items: { type: string }
        perApp:
          type: array
          items:
            type: object
            properties:
              appName: { type: string }
              fields:
                type: array
                items: { type: string }

    FlowsListResult:
      type: object
      properties:
        wabaId: { type: string }
        flows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              categories: { type: array, items: { type: string } }
              updatedAt: { type: string }

    FlowDetailResult:
      type: object
      properties:
        flowId: { type: string }
        name: { type: string }
        status: { type: string }
        categories: { type: array, items: { type: string } }
        updatedAt: { type: string }
        validationErrors: { type: array, items: { type: string } }
        previewUrl: { type: string }
        previewExpiresAt: { type: string }

    FlowScreensResult:
      type: object
      properties:
        flowId: { type: string }
        flowJsonVersion: { type: string }
        dataApiVersion: { type: string }
        screens: { type: array, items: { type: string } }
        terminalScreens: { type: array, items: { type: string } }
        routingRootScreens:
          type: array
          items: { type: string }
          description: >
            Screens with no incoming route - the only ones a Flow may open on.
            Opening on any other screen is rejected with error 131009.
        routingModel:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        danglingRoutes: { type: array, items: { type: string } }
        unreachableScreens: { type: array, items: { type: string } }
        note: { type: string }

    VerifyCredentialsResult:
      type: object
      properties:
        allValid: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties:
              resource: { type: string, enum: [waba, phone_number] }
              ok: { type: boolean }
              httpStatus: { type: integer }
              metaErrorType: { type: string }
              message: { type: string }
