# Manual production Android release gate.
#
# This workflow intentionally cannot run without the encrypted upload-keystore
# secrets. The preview APK workflow is debug-key signed and must never be used
# for Play Console uploads.
name: Android production APK and AAB

on:
  workflow_dispatch: {}

concurrency:
  group: android-production-aab
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  build:
    name: Build signed production APK and AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
      ZITCH_CONFIGURE_UPLOAD_SIGNING: "true"
      ZITCH_REQUIRE_UPLOAD_KEY: "true"
      ZITCH_REQUIRE_PUSH_CONFIG: "true"
      ZITCH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ZITCH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ZITCH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Production signing secrets must never be exposed to code from an
          # operator-supplied branch/tag. A release is built only from main;
          # the checkout SHA is recorded below and in the uploaded artifact.
          ref: refs/heads/main
          persist-credentials: false

      - name: Record release revision
        run: |
          release_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$release_sha" | tee "$RUNNER_TEMP/zitch-release-sha.txt"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Require successful release CI for checked-out commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 'Backend (Django)' 'Backend (PostgreSQL)' 'App (Expo)' 'Meta connector'; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.started_at) | last | .conclusion // \"missing\"")"
            if [ "$conclusion" != "success" ]; then
              echo "Required check '$check' is $conclusion for $RELEASE_SHA" >&2
              exit 1
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Require production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_STORE_PASSWORD" || { echo "Missing ANDROID_UPLOAD_STORE_PASSWORD" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_KEY_ALIAS" || { echo "Missing ANDROID_UPLOAD_KEY_ALIAS" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_KEY_PASSWORD" || { echo "Missing ANDROID_UPLOAD_KEY_PASSWORD" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zitch-upload.keystore"
          test -s "$RUNNER_TEMP/zitch-upload.keystore"
          echo "ZITCH_UPLOAD_STORE_FILE=$RUNNER_TEMP/zitch-upload.keystore" >> "$GITHUB_ENV"
        shell: bash

      - run: npm ci
      - name: Require Firebase configuration for Android push
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: node scripts/android-google-services.cjs
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: Build production APK and bundle
        working-directory: android
        run: |
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_STORE_FILE="$ZITCH_UPLOAD_STORE_FILE"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_STORE_PASSWORD="$ZITCH_UPLOAD_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_KEY_ALIAS="$ZITCH_UPLOAD_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_KEY_PASSWORD="$ZITCH_UPLOAD_KEY_PASSWORD"
          export ORG_GRADLE_PROJECT_ZITCH_REQUIRE_UPLOAD_KEY=true
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Verify AAB signer matches the configured upload key
        run: scripts/verify-android-signing.sh android/app/build/outputs/bundle/release/app-release.aab "$ZITCH_UPLOAD_STORE_FILE"
      - name: Verify APK signer, package and native security policy
        run: |
          python3 scripts/verify-android-apk.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --keystore "$ZITCH_UPLOAD_STORE_FILE" --signing upload \
            --revision "$RELEASE_SHA" --metadata "$RUNNER_TEMP/zitch-apk-build-info.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zitch-production-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/zitch-release-sha.txt
            ${{ runner.temp }}/zitch-apk-build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/zitch-upload.keystore"
