# Manual production Android release gate.
#
# This workflow intentionally cannot run without the encrypted upload-keystore
# secrets. The preview APK workflow is debug-key signed and must never be used
# for Play Console uploads.
name: Android production AAB

on:
  workflow_dispatch: {}

concurrency:
  group: android-production-aab
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  build:
    name: Build signed production AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
      ZITCH_CONFIGURE_UPLOAD_SIGNING: "true"
      ZITCH_REQUIRE_UPLOAD_KEY: "true"
      ZITCH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ZITCH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ZITCH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Production signing secrets must never be exposed to code from an
          # operator-supplied branch/tag. A release is built only from main;
          # the checkout SHA is recorded below and in the uploaded artifact.
          ref: refs/heads/main
          persist-credentials: false

      - name: Record release revision
        run: |
          release_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$release_sha" | tee "$RUNNER_TEMP/zitch-release-sha.txt"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Require successful release CI for checked-out commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 'Backend (Django)' 'Backend (PostgreSQL)' 'App (Expo)' 'Meta connector'; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.started_at) | last | .conclusion // \"missing\"")"
            if [ "$conclusion" != "success" ]; then
              echo "Required check '$check' is $conclusion for $RELEASE_SHA" >&2
              exit 1
            fi
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Require production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_STORE_PASSWORD" || { echo "Missing ANDROID_UPLOAD_STORE_PASSWORD" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_KEY_ALIAS" || { echo "Missing ANDROID_UPLOAD_KEY_ALIAS" >&2; exit 1; }
          test -n "$ZITCH_UPLOAD_KEY_PASSWORD" || { echo "Missing ANDROID_UPLOAD_KEY_PASSWORD" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zitch-upload.keystore"
          test -s "$RUNNER_TEMP/zitch-upload.keystore"
          echo "ZITCH_UPLOAD_STORE_FILE=$RUNNER_TEMP/zitch-upload.keystore" >> "$GITHUB_ENV"
        shell: bash

      - run: npm ci
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: Build production bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PZITCH_UPLOAD_STORE_FILE="$ZITCH_UPLOAD_STORE_FILE" -PZITCH_UPLOAD_STORE_PASSWORD="$ZITCH_UPLOAD_STORE_PASSWORD" -PZITCH_UPLOAD_KEY_ALIAS="$ZITCH_UPLOAD_KEY_ALIAS" -PZITCH_UPLOAD_KEY_PASSWORD="$ZITCH_UPLOAD_KEY_PASSWORD" -PZITCH_REQUIRE_UPLOAD_KEY=true
      - name: Verify AAB signer matches the configured upload key
        run: scripts/verify-android-signing.sh android/app/build/outputs/bundle/release/app-release.aab "$ZITCH_UPLOAD_STORE_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zitch-production-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/zitch-release-sha.txt
          if-no-files-found: error
          retention-days: 14
