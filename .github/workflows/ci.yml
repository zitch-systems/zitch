name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['landing/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['landing/**', 'docs/**', '**/*.md']

# Cancel superseded runs so a burst of pushes doesn't stack up Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which suites actually need to run for this change, so a backend-only
  # PR doesn't spin up the (heavier) Expo job and vice versa — the single biggest
  # lever on Actions minutes. The backend/app jobs gate on these outputs; a job
  # skipped this way still reports success, so required-status-check branch
  # protection is unaffected (unlike a workflow-level paths filter, which would
  # leave a required check pending forever).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "Running both suites so required checks produce real signal."

  backend:
    name: Backend (Django)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      # CI runs with the production-secure default (DEBUG off). Provide a
      # throwaway secret so the management commands below clear the "no dev
      # SECRET_KEY when DEBUG is off" boot guard. Not a real secret; the test
      # step is unaffected (Django forces DEBUG off under tests anyway).
      DJANGO_SECRET_KEY: "ci-only-throwaway-secret-not-used-in-production-000"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate + seed (SQLite)
        run: |
          python manage.py migrate --no-input
          python manage.py seed_plans
      - name: Tests
        run: python manage.py test

  app:
    name: App (Expo)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Blocking on errors (warnings are allowed through). Run eslint directly so
      # CI is deterministic and non-interactive (avoids `expo lint`'s setup path).
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test -- --ci
      # The full Metro/iOS bundle is the most minute-heavy step and rarely catches
      # what tsc + jest miss, so only run it on pushes to main (the merged result),
      # not on every PR revision.
      - name: Bundle (Metro export, iOS)
        if: github.event_name == 'push'
        run: npx expo export --platform ios --output-dir /tmp/ciexport
