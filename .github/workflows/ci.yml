name: CI

on:
  push:
    branches: [main]
    # `landing/**` is no longer ignored: the landing app ships raw .jsx that the
    # browser transpiles, and the browser-asset parse check below is the only
    # thing that reads it. Ignoring it would mean a syntax error there could
    # merge without any check running at all.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# Least privilege: every job only reads the repo. Nothing here writes to the
# repo, packages, or deployments, so the default write token is unnecessary.
permissions:
  contents: read

# Cancel superseded runs so a burst of pushes doesn't stack up Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    env:
      # CI runs with the production-secure default (DEBUG off). Provide a
      # throwaway secret so the management commands below clear the "no dev
      # SECRET_KEY when DEBUG is off" boot guard. Not a real secret; the test
      # step is unaffected (Django forces DEBUG off under tests anyway).
      DJANGO_SECRET_KEY: "ci-only-throwaway-secret-not-used-in-production-000"
      # This job is deliberately single-process; production keeps the secure
      # default and must provide Redis for cross-worker rate-limit state.
      DJANGO_REQUIRE_SHARED_CACHE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # `manage.py check` imports the installed apps, but not modules nothing
      # imports at boot — management commands most of all, which is exactly
      # where a syntax error hides until an operator runs it during an incident.
      - name: Compile every module
        run: python -m compileall -q . -x '(__pycache__|\.venv)'
      # The Flow JSON carries the logo as inlined base64, because WhatsApp Flows
      # cannot fetch a remote image. That makes the JSON a build output as much
      # as a source file: change the mark and the published Flow keeps the old
      # bytes until someone remembers to re-run the script.
      - name: WhatsApp Flow JSON is built from the current logo
        working-directory: .
        run: |
          pip install --quiet pillow
          python scripts/build-flow-logo.py --check
      - name: System check
        run: python manage.py check
      - name: Deploy checks
        # The production-settings audit (SECURE_*, cookies, HSTS, DEBUG…). CI runs
        # with DEBUG off (see env above), so this validates what prod actually boots
        # with. Fails only on errors; warnings print for review.
        run: python manage.py check --deploy
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate + seed (SQLite)
        run: |
          python manage.py migrate --no-input
          python manage.py seed_plans
      - name: Tests
        run: python manage.py test

  security:
    name: Security (secrets + Python dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Secret scan — gitleaks as a pinned release binary (not the marketplace
      # action, which the org's GitHub-authored-only actions policy would block
      # and which needs a license key for orgs). Full history is checked out so a
      # secret cannot remain recoverable in an earlier commit while the tip scans
      # clean. Blocking.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      # Python dependency audit — resolves the requirement floors as pip would
      # today and checks the result against the vulnerability DBs. Clean as of
      # the cryptography>=48.0.1 / Pillow>=12.2 floors, so this is blocking.
      - name: pip-audit
        run: |
          pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt
  app:
    name: App (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Use npm 11 audit client
        run: npm install --global npm@11.6.2
      - run: npm ci
      # Audit the installed production tree. The wrapper permits only explicitly
      # mitigated, expiring build-parser advisories; every other high/critical
      # finding still fails. Lockfile-only auditing hits npm's retired quick
      # endpoint and can reject an otherwise valid dependency tree.
      - name: npm audit (production high + critical)
        run: |
          audit_status=0
          for attempt in 1 2 3; do
            if audit_output="$(npm run audit:security 2>&1)"; then
              printf '%s\n' "$audit_output"
              exit 0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"
            if ! printf '%s\n' "$audit_output" | grep -Eq 'audit endpoint returned an error|invalid json response body|400 Bad Request'; then
              exit "$audit_status"
            fi
            [ "$attempt" -eq 3 ] || sleep 5
          done
          echo "ERROR: npm advisory service unavailable after 3 attempts; failing closed."
          exit "$audit_status"
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Expo project health
        run: npx expo-doctor
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --ci
      # The operator console, portal and landing app ship raw .jsx and transpile
      # it in the browser. Nothing else in this pipeline reads those files — not
      # the Expo bundle, not tsc, not eslint — so a syntax error there is
      # invisible until someone opens a blank page. On the console, that is the
      # screen used to investigate incidents.
      - name: Browser assets parse (console, portal, landing)
        run: npm run check:browser-assets
      # Runs on pull requests too, not just merges to main: catching a broken
      # bundle after it has landed means main is already red for everyone.
      - name: Bundle (Metro export, iOS)
        run: npx expo export --platform ios --output-dir /tmp/ciexport
