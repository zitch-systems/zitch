name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so a burst of pushes doesn't stack up Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which suites actually need to run for this change, so a backend-only
  # PR doesn't spin up the (heavier) Expo job and vice versa — the single biggest
  # lever on Actions minutes. The suite jobs gate on these outputs; a job
  # skipped this way still reports success, so required-status-check branch
  # protection is unaffected (unlike a workflow-level paths filter, which would
  # leave a required check pending forever).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      connector: ${{ steps.filter.outputs.connector }}
    steps:
      - id: filter
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "connector=true" >> "$GITHUB_OUTPUT"
          echo "Running every suite so required checks produce real signal."

  backend:
    name: Backend (Django)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      # CI runs with the production-secure default (DEBUG off). Provide a
      # throwaway secret so the management commands below clear the "no dev
      # SECRET_KEY when DEBUG is off" boot guard. Not a real secret; the test
      # step is unaffected (Django forces DEBUG off under tests anyway).
      DJANGO_SECRET_KEY: "ci-only-throwaway-secret-not-used-in-production-000"
      DJANGO_DEBUG: "false"
      # System-check/migration steps intentionally exercise SQLite before the
      # test command sets settings.TESTING. The settings guard accepts this only
      # in CI; a deployed process still requires PostgreSQL.
      DJANGO_ALLOW_SQLITE: "true"
      DJANGO_ALLOWED_HOSTS: "testserver,localhost"
      DJANGO_REQUIRE_SHARED_CACHE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      # Exercise Django's static production-setting checks with production-shaped
      # backends. These URLs are never contacted by `check`; live DB/Redis reachability
      # remains the deployed /readyz gate.
      - name: Production deployment setting checks
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          DJANGO_REQUIRE_SHARED_CACHE: "true"
          DJANGO_ALLOWED_HOSTS: api.zitch.ng
        run: python manage.py check --deploy --fail-level WARNING
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate + seed (SQLite)
        run: |
          python manage.py migrate --no-input
          python manage.py seed_plans
      - name: Tests
        run: python manage.py test

  backend-postgres:
    name: Backend (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # ECR's public mirror returned a data-limit error before tests could run.
        # Use Docker Hub's official image, pinned to the exact same digest that
        # passed the prior main run. No database version or coverage change.
        image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: zitch_ci
          POSTGRES_PASSWORD: zitch-ci-local-password
          POSTGRES_DB: zitch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zitch_ci -d zitch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately local, non-production credentials. Unlike the SQLite lane,
      # this job boots with the production database engine so PostgreSQL locks,
      # constraints and transaction behavior are actually exercised.
      DJANGO_SECRET_KEY: "ci-only-postgres-secret-not-used-in-production-000"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "testserver,localhost"
      DJANGO_REQUIRE_SHARED_CACHE: "false"
      # The job's loopback-only service container does not offer TLS. Production
      # keeps settings.py's secure default (SSL required when DEBUG is false).
      DJANGO_DB_SSL: "false"
      DATABASE_URL: "postgresql://zitch_ci:zitch-ci-local-password@127.0.0.1:5432/zitch_ci"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration consistency (PostgreSQL)
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --no-input
          python manage.py migrate --check
      - name: Tests (PostgreSQL)
        run: python manage.py test

  wema-cutover-schema:
    name: Wema migration from 9PSB database (PostgreSQL)
    needs: changes
    # Guards the forward migration out of the recorded 9PSB-era schema: that it
    # keeps the bank evidence and that the cutover audit still refuses to promote.
    # Production has NOT been migrated yet, so this has to run on every backend
    # change, not just on the merged branch that introduced it. It was pinned to
    # 'migration/restore-wema-partnership-20261108' (merged in #597), which made it
    # unreachable. Builds a throwaway container from the pinned legacy release; the
    # live API and the production database stay untouched.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: zitch_ci
          POSTGRES_PASSWORD: zitch-ci-local-password
          POSTGRES_DB: zitch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zitch_ci -d zitch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: "ci-only-schema-compatibility-secret-000"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "testserver,localhost"
      DJANGO_REQUIRE_SHARED_CACHE: "false"
      DJANGO_DB_SSL: "false"
      DATABASE_URL: "postgresql://zitch_ci:zitch-ci-local-password@127.0.0.1:5432/zitch_ci"
    steps:
      - name: Checkout Wema restoration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout recorded pre-cutover 9PSB release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 9c5127696bc78fe454164df05870720017bafa90
          path: legacy-9psb
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install migration dependencies
        run: pip install -r legacy-9psb/backend/requirements.txt -r backend/requirements.txt
      - name: Build historical 9PSB-era database with synthetic accounts
        working-directory: legacy-9psb/backend
        run: |
          python manage.py migrate --no-input
          python manage.py shell -c '
          from decimal import Decimal
          from accounts.models import User
          from wallet.models import Wallet
          from banking.models import BankAccount, PreviousBankArchive
          u = User.objects.create_user(username="cutover-synthetic", phone="08000000001", email="cutover@example.invalid")
          w = Wallet.objects.create(user=u, balance=Decimal("500"), account_number="")
          BankAccount.objects.create(wallet=w, number="9012345678", name="Synthetic Customer", environment="sandbox", tier=1, status="pending")
          PreviousBankArchive.objects.create(wallet=w, account_number="0123456789", account_name="Synthetic Customer",
              bank_name="Wema Bank", balance=Decimal("500"), pending_transactions=1, review_required=True)
          '
      - name: Forward migrate restored Wema without deleting bank evidence
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
          python manage.py migrate --no-input
          python manage.py migrate --check
          python manage.py shell -c '
          from django.db import connection
          from accounts.models import User
          from wallet.partnership import previous_provider_cutover_blockers
          tables = set(connection.introspection.table_names())
          assert {"banking_bankaccount", "banking_previousbankarchive"} <= tables
          u = User.objects.get(username="cutover-synthetic")
          assert set(previous_provider_cutover_blockers(u)) == {
              "previous_provider_account_review", "archived_wema_balance_review"
          }, "Previous bank assets cannot be mistaken for spendable Wema funds"
          with connection.cursor() as cursor:
              cursor.execute("SELECT balance FROM banking_previousbankarchive WHERE wallet_id=(SELECT id FROM wallet_wallet WHERE user_id=%s)", [u.pk])
              assert str(cursor.fetchone()[0]) == "500.00"
          '
      - name: Read-only cutover inventory must explicitly block promotion
        working-directory: backend
        run: |
          if python manage.py wema_cutover_audit --json > /tmp/wema-cutover-audit.json; then
            echo "UNSAFE: historical bank evidence was not blocked"
            exit 1
          fi
          python -c 'import json; d=json.load(open("/tmp/wema-cutover-audit.json")); assert not d["ready_for_cutover"]; assert d["aggregate_counts"]["bank_accounts"] == 1; assert d["aggregate_counts"]["archived_bank_reviews"] == 1; assert "9psb_accounts_require_bank_side_closeout_and_reconciliation" in d["blockers"]'

  app:
    name: App (Expo)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Blocking on errors (warnings are allowed through). Run eslint directly so
      # CI is deterministic and non-interactive (avoids `expo lint`'s setup path).
      - name: Lint
        run: npx eslint .
      - name: Build-tool compatibility checks
        run: npm run test:build-patches
      - name: Unit tests
        run: npm test -- --ci
      # The full Metro/iOS bundle is the most minute-heavy step and rarely catches
      # what tsc + jest miss, so only run it on pushes to main (the merged result),
      # not on every PR revision.
      - name: Bundle (Metro export, iOS)
        if: github.event_name == 'push'
        run: npx expo export --platform ios --output-dir /tmp/ciexport

  meta-connector:
    name: Meta connector
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zitch-meta-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: zitch-meta-connector/.node-version
          cache: npm
          cache-dependency-path: zitch-meta-connector/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
