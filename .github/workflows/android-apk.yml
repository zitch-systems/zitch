# Builds an installable Android APK on GitHub Actions — no Codemagic/EAS build
# credits needed. Mirrors codemagic.yaml's android-apk workflow (same prebuild +
# Gradle steps) so both stay usable side by side.
name: Android APK

on:
  # Explicit release refs avoid rebuilding the same merged revision once for
  # main and again for publication. Ordinary CI still runs on every main push.
  push:
    tags: ['zitch-android-test-*']
  # REST/GraphQL branch creation emits create; filter it at the build job.
  # Branch pushes are excluded so one branch creation cannot start two builds.
  create: {}
  # Build on demand from the Actions tab, any branch.
  workflow_dispatch: {}

# Never cancel a release while its verified assets are being published.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

# Build jobs never receive production signing keys or a repository write token.
# Only an explicit test-release tag or branch can publish a GitHub pre-release.
permissions:
  contents: read
  checks: read
  actions: read

jobs:
  build:
    name: Build sideload APK
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/zitch-android-test-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Mirrors eas.json's "preview" profile so the app talks to the live API.
      EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require reviewed main revision for a test release
        if: startsWith(github.ref, 'refs/tags/zitch-android-test-') || startsWith(github.ref, 'refs/heads/release/zitch-android-test-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          [[ "$release_tag" =~ ^zitch-android-test-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo 'Invalid Android test-release name.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Test releases must use a revision merged into main.' >&2
            exit 1
          }
          for check in 'Backend (Django)' 'Backend (PostgreSQL)' 'App (Expo)' 'Meta connector'; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\" and .app.slug == \"github-actions\")] | sort_by(.started_at) | last | .conclusion // \"missing\"")"
            test "$conclusion" = success || {
              echo "Required check '$check' must succeed for $GITHUB_SHA before creating the release ref; found $conclusion." >&2
              exit 1
            }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Handles Gradle dependency/build caching, so we don't need a manual
      # actions/cache step for $HOME/.gradle.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - run: npm ci

      - name: Configure Android push when Firebase configuration is available
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: node scripts/android-google-services.cjs

      - name: Check APK verifier safety gates
        run: python3 -m unittest discover -s scripts/__tests__ -p 'test_android*.py'

      - name: Expo prebuild (generate the native android/ project)
        # Test builds are their own app, "Zitch Test" (com.zitch.app.test), so they
        # install beside the Play Store app instead of failing with "App not installed".
        env:
          ZITCH_ANDROID_VARIANT: test
        run: npx expo prebuild --platform android --clean

      # Two builds of the same app from one prebuild. Phones run ARM, the CI
      # emulator runs x86_64, and an APK carrying all four ABIs is twice the
      # download and twice the storage a phone needs (a common cause of
      # "App not installed"). No production keystore is exposed to this preview
      # workflow, so both are signed with the debug key: internal testing only,
      # never Play upload.
      - name: Build the emulator APK (x86_64)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          mkdir -p ../emulator-apk
          cp app/build/outputs/apk/release/app-release.apk ../emulator-apk/ZitchTest-emulator.apk

      - name: Build the phone APK (ARM, 32-bit and 64-bit)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify and stage the exact installable APK
        run: |
          # The name carries the version and revision, so an older download
          # left on the phone cannot be opened by mistake.
          apk_name="ZitchTest-$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::8}.apk"
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk "release-apk/$apk_name"
          python3 scripts/verify-android-apk.py \
            --apk emulator-apk/ZitchTest-emulator.apk --abis x86_64 \
            --keystore android/app/debug.keystore --signing preview --package com.zitch.app.test \
            --revision "$GITHUB_SHA" --metadata emulator-apk/build-info.json
          python3 scripts/verify-android-apk.py \
            --apk "release-apk/$apk_name" --abis armeabi-v7a,arm64-v8a \
            --same-app-as emulator-apk/ZitchTest-emulator.apk \
            --keystore android/app/debug.keystore --signing preview --package com.zitch.app.test \
            --revision "$GITHUB_SHA" --metadata release-apk/build-info.json
          # A test build must carry every signature scheme (withAndroidTestSigning).
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          # --min-sdk-version 21: apksigner skips the v1 check for an Android 7+ range.
          "$apksigner" verify --verbose --min-sdk-version 21 "release-apk/$apk_name" | tee signature.txt
          for scheme in 'v1 scheme (JAR signing)' 'v2 scheme (APK Signature Scheme v2)' 'v3 scheme (APK Signature Scheme v3)'; do
            grep -qF "Verified using $scheme: true" signature.txt || {
              echo "The phone APK is not signed with $scheme." >&2
              exit 1
            }
          done
          cd release-apk
          sha256sum "$apk_name" > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zitch-sideload-apk
          path: release-apk/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zitch-emulator-apk
          path: emulator-apk/ZitchTest-emulator.apk
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Android emulator smoke
    needs: build
    if: startsWith(github.ref, 'refs/tags/zitch-android-test-') || startsWith(github.ref, 'refs/heads/release/zitch-android-test-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Download this run's verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name zitch-sideload-apk --dir release-apk
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name zitch-emulator-apk --dir emulator-apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise startup and sign-in validation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd release-apk && sha256sum -c SHA256SUMS.txt && cd ..
            adb install emulator-apk/ZitchTest-emulator.apk
            python3 scripts/android-release-smoke.py --package com.zitch.app.test --output-dir android-smoke-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zitch-android-smoke-results
          path: android-smoke-results/
          if-no-files-found: warn
          retention-days: 30

  install-oldest:
    # The app claims Android 7 as its minimum. Prove the package installs there.
    name: Android 7 install check
    needs: build
    if: startsWith(github.ref, 'refs/tags/zitch-android-test-') || startsWith(github.ref, 'refs/heads/release/zitch-android-test-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download this run's emulator APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name zitch-emulator-apk --dir emulator-apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install on Android 7.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install emulator-apk/ZitchTest-emulator.apk
            adb shell pm path com.zitch.app.test | grep -q '^package:'

  publish:
    name: Publish downloadable test APK
    needs: [build, smoke, install-oldest]
    if: startsWith(github.ref, 'refs/tags/zitch-android-test-') || startsWith(github.ref, 'refs/heads/release/zitch-android-test-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download this run's verified and smoke-tested APK
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name zitch-sideload-apk --dir release-apk
      - name: Publish GitHub pre-release with APK and checksum
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          [[ "$release_tag" =~ ^zitch-android-test-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo 'Invalid Android test-release name.' >&2
            exit 1
          }
          tag_args=(--target "$GITHUB_SHA")
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
            test "$tag_sha" = "$GITHUB_SHA" || {
              echo 'Existing release tag points to a different revision; refusing publication.' >&2
              exit 1
            }
            tag_args=(--verify-tag)
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'The triggering release tag no longer exists; refusing publication.' >&2
            exit 1
          fi
          cd release-apk
          sha256sum -c SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Download the **ZitchTest-….apk** file under Assets on your Android phone and open it to install. The Source code ZIP files are not needed.

          It installs as its own app, **Zitch Test** (com.zitch.app.test), beside any Zitch already on the phone, and works on Android 7 and later, on 32-bit and 64-bit ARM phones. This is an internal Android test build, signed with the debug/test key. It connects to https://api.zitch.ng and is not a Play Store production release.

          Automated checks cover the exact revision's app tests, native package/version, APK signature (schemes v1, v2 and v3), permissions, embedded JavaScript, installation on Android 7, and emulator startup/sign-in validation. The emulator runs an x86_64 build of the same JavaScript and manifest; the ARM file published here has not been run on a physical phone by these checks. Bank activation, real OTP, push notification delivery, device biometrics, and live money settlement require separate verification.

          build-info.json reports whether Firebase configuration is embedded in this APK. When android_push.firebase_config_present is false, remote push notifications are unavailable in this build. Even when present, live delivery needs the matching FCM v1 credential in the Expo project and a physical-device check.

          This build uses Wema Partnership on the app and WhatsApp. Live availability follows each customer's verified account status. Retired virtual-account enrollment and customer flows are removed. Historical balances, held receipts and unresolved bills remain protected for reconciliation.

          Tier 1 supports BVN or NIN with bank SMS OTP or the bank-hosted face route. Tier 2 connects verified-BVN customers to Prembly's interactive face and gesture-liveness workflow without requiring NIN. Completion is accepted only after authenticated provider evidence matches the verified identity; a real camera completion still requires live validation. New Tier 3 upgrades remain unavailable until Wema's completion evidence can be tied to the submitted address; existing pending requests stay in review. This build does not certify go-live readiness.

          SHA256SUMS.txt verifies the downloaded APK. build-info.json records its source commit, version, and signing certificate.
          NOTES
          gh release create "$release_tag" ZitchTest-*.apk SHA256SUMS.txt build-info.json \
            --repo "$GITHUB_REPOSITORY" "${tag_args[@]}" --prerelease --latest=false \
            --title "Zitch Android test APK — $release_tag" --notes-file release-notes.md
