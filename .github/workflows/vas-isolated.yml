name: VAS isolated contract tests

on:
  push:
    branches: [codex/vas-isolated-preparation, codex/vas-isolated-e2e]
    paths:
      - 'incubator/wema_vas/**'
      - '.github/workflows/vas-isolated.yml'
  pull_request:
    paths:
      - 'incubator/wema_vas/**'
      - '.github/workflows/vas-isolated.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vas-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: incubator/wema_vas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test vas_harness --verbosity 2
      # No deployment, external services, bank keys, or production secrets.
