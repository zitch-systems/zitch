name: Build APK

# Manually-triggered Android build via EAS. Run it from the Actions tab
# ("Build APK" → Run workflow) or with the GitHub API. EAS runs the build on
# Expo's cloud, so this job only kicks it off and returns the build URL — it does
# not sit and burn Actions minutes (--no-wait).
#
# Requires a repo secret EXPO_TOKEN (expo.dev → Account → Settings → Access
# tokens) for the `zitch` Expo account. Uses only GitHub-authored actions plus a
# plain `npx eas-cli` step, so it stays within an org "Allowed actions" policy
# that permits only GitHub-authored actions (same reason ci.yml inlines its
# path filter instead of using a third-party action).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = installable APK)"
        default: preview
        type: choice
        options:
          - preview
          - preview2
          - production

jobs:
  build:
    name: EAS build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions (a token for the 'zitch' Expo account)."
            exit 1
          fi
      - name: Trigger EAS build
        env:
          # eas-cli authenticates non-interactively from EXPO_TOKEN.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait
