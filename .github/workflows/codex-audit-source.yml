name: Codex audit source export

on:
  push:
    branches:
      - codex/wema-production-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/zitch-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: zitch-audit-source
          path: ${{ runner.temp }}/zitch-source.tar.gz
          if-no-files-found: error
          retention-days: 1
