# Render blueprint. In Render: New + > Blueprint > point at this repo (root
# dir = backend). Creates the web service + a managed Postgres and wires them.
services:
  - type: web
    name: zitch-api
    runtime: python
    rootDir: backend
    plan: free   # upgrade to "starter" before handling real money (no sleep)
    buildCommand: "./build.sh"
    # Bind to 0.0.0.0:$PORT so Render's port scan can detect the service. Without
    # an explicit --bind, gunicorn listens on 127.0.0.1:8000 (loopback only), which
    # Render can't see -> "no open ports detected" and the deploy times out. Render
    # injects PORT (default 10000, which the health check targets).
    # ONE worker x 8 threads. Threads still absorb slow provider calls (Wema/VTU do
    # network I/O in-request) so one can't stall every other request; --timeout
    # bounds a hung worker.
    #
    # One worker, not two, for two independent reasons:
    #   * MEMORY. Two workers each load Django plus the whole provider stack and
    #     then hold provider payloads (the bank list alone is ~499 entries). On the
    #     512MB free/starter tiers that OOMs — observed 2026-07-28, "Worker was sent
    #     SIGKILL! Perhaps out of memory?", which returns 503 to live callers.
    #   * CORRECTNESS. Without REDIS_URL the cache is per-process LocMem, and the
    #     BVN KYC handshake stores its pending code there — so with 2 workers the
    #     confirm request lands on the wrong process about half the time. Rate
    #     limits and login lockouts are likewise per-worker, doubling every cap.
    #
    # To go back to multiple workers: provision a Render Key Value instance, set
    # REDIS_URL, and raise this — in that order. REQUIRE_SHARED_CACHE exists to
    # enforce exactly that ordering.
    startCommand: "gunicorn zitch_api.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 8 --timeout 60"
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,api.zitch.ng"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.zitch.ng"
      # Bootstrap the back-office super admin. The free tier has no shell, so
      # build.sh running seed_ops on each deploy is the ONLY way in — and it is
      # gated on PASSWORD being non-empty, so leaving this blank means /admin/
      # has no account at all and every login is refused. Declared here (rather
      # than only in build.sh) so the fields are visible in the Render dashboard
      # instead of being invisible unless you read the build script.
      # Sign in with the USERNAME below, or with the EMAIL — both work.
      # Re-deploying with a new PASSWORD resets it, which is the recovery path
      # if it is ever lost.
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: TOKEN_TTL_HOURS
        value: "24"
      # Origins allowed to call the API cross-origin (Expo web build /
      # browser-based dashboards). Native React Native does not enforce CORS,
      # so the mobile app is unaffected. Add new origins here as needed.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://zitch.ng,https://www.zitch.ng,http://localhost:8081,http://localhost:19006,http://localhost:19000"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      # Fill these in the Render dashboard (kept out of source):
      # Money rail is Wema / ALAT (see the WEMA_* block below) — funding (dedicated
      # NUBANs via BVN/NIN + OTP), payouts + name enquiry + balance, and BVN/NIN/vNIN
      # identity (Full KYC). Selfie/liveness + address + ID-document stay on Prembly;
      # cards on CARD_ISSUER (Wema card issuing not wired yet).
      # Optional: DIAG_TOKEN + WEMA_DIAG_TOKEN enable the /wema-diagnose?token=... and
      # /vtu-diagnose browser self-tests.
      - key: DIAG_TOKEN
        sync: false
      - key: WEMA_DIAG_TOKEN
        sync: false
      # Virtual-card backend: "issuer" (generic CARD_ISSUER) — the sole backend; blank => issuer.
      - key: CARD_PROVIDER
        sync: false
      # Wallet FUND-IN rail: "wema" (the sole rail); blank => wema.
      - key: PAYMENT_PROVIDER
        sync: false
      # Bank-PAYOUT + recipient name-enquiry rail: "wema" (the sole rail); blank => wema.
      - key: PAYOUT_PROVIDER
        sync: false
      # BVN/NIN/vNIN KYC rail: "wema" (Wema Full KYC, the sole rail); blank => wema.
      # Selfie/liveness + address + ID-document are on Prembly.
      - key: KYC_PROVIDER
        sync: false
      # ---------------------------------------------------------------------
      # Wema / ALAT — the SOLE money-movement + Nigeria-KYC rail. Set WEMA_CHANNEL_ID
      # + WEMA_WALLET_KEY (and the per-product keys card/airtime/bills/kyc),
      # WEMA_SOURCE_ACCOUNT (the pool NUBAN that funds payouts), the live WEMA_BASE_URL,
      # and the WEMA_SECURITY_INFO scheme. Blank keys => mock; WEMA_SIMULATION=true
      # tests the flow without live keys (no real money). There is NO inbound-credit
      # webhook — deposits AND payout settlement are polled by the zitch-reconcile-wema
      # cron. See docs/wema-migration.md and utility/wema.py.
      # ---------------------------------------------------------------------
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_CARD_KEY
        sync: false
      - key: WEMA_AIRTIME_KEY
        sync: false
      - key: WEMA_BILLS_KEY
        sync: false
      - key: WEMA_KYC_KEY
        sync: false
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      - key: WEMA_SECURITY_INFO
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      - key: WEMA_SIMULATION
        sync: false
      # Bank-called callbacks. Wema PROFILES these URLs and the rails do not work
      # until it has them (account creation is refused without the Account Creation
      # URL; transactions fail auth without the Authentication URL). The token is the
      # shared secret in the URL path — the bank signs nothing.
      #   https://api.zitch.ng/webhooks/wema/{account,authorize,transaction,notification}/<TOKEN>
      - key: WEMA_CALLBACK_TOKEN
        sync: false
      - key: WEMA_CALLBACK_TOKEN_PREV
        sync: false
      - key: WEMA_CALLBACK_ENFORCE_IPS
        sync: false
      - key: WEMA_CALLBACK_IPS
        sync: false
      - key: WEMA_AUTH_MAX_AGE
        sync: false
      - key: WEMA_AUTH_REQUIRE_SECURITY_INFO
        sync: false
      # Open banking — Mono (link bank, balance/transactions, DirectPay funding).
      # Blank SECRET_KEY => mock. Webhook: /api/banklink/webhook/. BASE_URL
      # defaults to https://api.withmono.com in code.
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_PUBLIC_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      # DEMO/PILOT ONLY — serves the SIMULATED bank-link flow (the app's
      # "Simulate" sheet) while no Mono keys are set: no real bank is contacted
      # and no real money moves, but the link flow is testable in a production
      # build. !! Set to "false" (or delete) the moment MONO_SECRET_KEY goes
      # live — leaving it on would keep serving fake links to real users.
      #
      # Dashboard-owned (sync: false), NOT a literal `value:`. A literal here is
      # Blueprint-owned, so every Blueprint sync force-restores it — and since
      # production_checks rejects any simulation flag without
      # ALLOW_PRODUCTION_SIMULATION, a committed "true" re-breaks the boot after
      # an operator has already turned it off in the dashboard. That failure
      # looks like the fix "not sticking", with nothing in the diff to explain
      # it. Every other provider flag is sync: false for the same reason.
      - key: MONO_SIMULATION
        sync: false
      # VTU / bills — VTU.ng (v2). JWT Bearer auth, no IP whitelisting. Set
      # VTUNG_API_KEY (a long-lived token) OR VTUNG_USERNAME + VTUNG_PASSWORD
      # (auto-refreshed JWT).
      - key: VTUNG_API_KEY
        sync: false
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      # SMS / OTP — Sendchamp.
      - key: SENDCHAMP_API_KEY
        sync: false
      # Email / OTP fallback — Resend. Sends the same OTP alongside SMS so an
      # SMS routing issue (DND / sender ID block) never strands signup.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "no-reply@zitch.ng"
      # KYC — Prembly (IdentityPass); also gates the large-transfer face check.
      - key: PREMBLY_API_KEY
        sync: false
      - key: PREMBLY_APP_ID
        sync: false
      # Virtual card issuer. The integration is generic (configurable base URL +
      # Bearer key, standard /cards endpoints) — set these for your provider
      # (e.g. Sudo, Maplerad, Bani). Until API_KEY is set the card feature fails
      # closed in production (no fake cards). BRAND defaults to Verve in code.
      - key: CARD_ISSUER_API_KEY
        sync: false
      - key: CARD_ISSUER_BASE_URL
        sync: false
      - key: CARD_ISSUER_BRAND
        sync: false
      # FX rail — Fincra (multi-currency Convert). Without these the Convert
      # screen fails closed in production. NGN/USD/GBP/CAD settle; CNY is
      # quote-only. BASE_URL defaults to https://api.fincra.com in code.
      - key: FINCRA_SECRET_KEY
        sync: false
      - key: FINCRA_BUSINESS_ID
        sync: false
      # WhatsApp channel — Meta Cloud API. Blank TOKEN => channel stays mocked.
      # Set the same VERIFY_TOKEN in the Meta app dashboard; APP_SECRET enables
      # inbound webhook HMAC verification.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      # WhatsApp AI intent layer (optional). Blank => the deterministic router
      # handles everything; the model only proposes intents, never moves money.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      # Error reporting — blank keeps Sentry off (the SDK never initializes).
      # Set the project DSN here to activate it (PII is never sent).
      - key: SENTRY_DSN
        sync: false
      # Shared cache — REQUIRED for accurate rate limits / idempotency fallback
      # once gunicorn runs more than one worker (it does, see startCommand).
      # Point at a Render Key Value (or any Redis) instance; blank falls back to
      # per-process LocMem, which a single worker tolerates but two do not.
      - key: REDIS_URL
        sync: false

  # Daily Fixed Save maturity sweep — pays out matured plans, including for
  # users who never open the app. REQUIRES A PAID RENDER PLAN: the cron service
  # type has no free tier, so on a free plan this block fails the Blueprint sync.
  # (Maturities also settle on access via /api/savings/list/, so the app stays
  # correct even without this cron.)
  - type: cron
    name: zitch-maturities
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 1 * * *"   # 01:00 UTC daily
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_maturities"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString

  # VTU reconciliation — settle purchases left PENDING by a provider timeout:
  # requery the aggregator by reference, then mark Successful (delivered) or
  # refund (definitively failed). Also requires a paid plan (cron has no free
  # tier). Runs every 10 minutes so stuck purchases clear quickly.
  - type: cron
    name: zitch-reconcile-vtu
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_vtu"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString

  # Wema reconciliation — Wema exposes NO webhooks, so this poller does two jobs:
  # (1) FUNDING: sweep each Wema NUBAN's transaction history and credit inbound
  # deposits (idempotent on Wema's referenceId); (2) PAYOUTS: poll
  # ConfirmClientTransferStatus for any bank payout left PENDING and settle (success)
  # or reverse (failed) it. Without this, deposits never credit and a PENDING payout
  # sits debited forever. Requires a paid plan (cron has no free tier). Runs every 10
  # minutes. NOTE: crons are separate from the web service, so set the WEMA_* keys here.
  - type: cron
    name: zitch-reconcile-wema
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_wema"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      - key: WEMA_SECURITY_INFO
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      # Paging: reconcile_wema calls utility.alerts.alert on a crashed run or a
      # systemic gateway outage. That reaches Sentry only when SENTRY_DSN is set
      # in THIS cron's env (crons are separate processes from the web service).
      - key: SENTRY_DSN
        sync: false

  # Ledger <-> balance integrity check — recomputes every wallet from the
  # append-only ledger and fails (alerting via cron failure + AuditLog snapshot)
  # on any drift. Read-only apart from one AuditLog row per run. Also requires a
  # paid plan (cron has no free tier).
  - type: cron
    name: zitch-integrity-check
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "30 2 * * *"   # 02:30 UTC daily, after the maturity sweep
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py integrity_check --fail-nonzero"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      # Paging: integrity_check calls utility.alerts.alert on a mismatch, which
      # reaches Sentry only when SENTRY_DSN is set in this cron's env.
      - key: SENTRY_DSN
        sync: false

  # Ledger <-> BANK (Wema NUBAN) reconciliation — the EXTERNAL integrity check.
  # integrity_check compares the ledger to our own stored balance; this compares
  # the ledger to the real balance ALAT holds in each user's NUBAN, and pages
  # (Sentry) when the ledger EXCEEDS the bank (a possible float leak / double
  # credit). --fail-over also exits nonzero on that dangerous direction so Render
  # surfaces a cron failure even before Sentry is wired; a benign bank>ledger
  # delta (a deposit not yet swept by zitch-reconcile-wema) neither pages nor
  # fails. Read-only. Needs the WEMA_* balance-read keys + SENTRY_DSN. Only acts
  # when Wema is live (no-ops in sandbox/sim). Every 6 hours; tune as needed.
  - type: cron
    name: zitch-reconcile-balances
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_balances --fail-over"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # DAILY SETTLEMENT STATEMENT — the whole float position, not per-wallet drift.
  # integrity_check and reconcile_balances both compare ONE wallet against ONE
  # counterpart. Neither can see the two pots that hold customer money but belong
  # to no user: the pool account (WEMA_SOURCE_ACCOUNT) and our VTU.ng provider
  # wallet. A VAS purchase debits the customer's ledger and OUR VTU wallet while
  # their NUBAN keeps the cash — per-wallet checks stay green while the VAS rail
  # drains. This command sums everything owed against everything held on every
  # rail and pages on a shortfall. Needs the VTU credentials as well as the WEMA
  # balance-read keys, or it reports an unreadable rail (which is itself an alert,
  # never a silent zero). Read-only. See docs/settlement-operating-model.md for
  # the thresholds and who owns the response.
  - type: cron
    name: zitch-settlement-report
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 6 * * *"   # 06:00 UTC = 07:00 Lagos, before the business day
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py settlement_report --fail-on-breach"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      # The VAS asset rail. Without these the provider wallet reads as UNREADABLE
      # and the position is reported advisory rather than authoritative.
      - key: VTUNG_API_KEY
        sync: false
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: zitch-db
    plan: free   # upgrade before go-live; free Postgres expires
