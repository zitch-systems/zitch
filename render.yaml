# Render blueprint. In Render: New + > Blueprint > point at this repo (root
# dir = backend). Creates the web service + a managed Postgres and wires them.
services:
  - type: web
    name: zitch-api
    runtime: python
    rootDir: backend
    # Money movement must not run on a sleeping/free instance. This takes effect
    # only when an operator deliberately syncs the Blueprint.
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: "./build.sh"
    # Bind to 0.0.0.0:$PORT so Render's port scan can detect the service. Without
    # an explicit --bind, gunicorn listens on 127.0.0.1:8000 (loopback only), which
    # Render can't see -> "no open ports detected" and the deploy times out. Render
    # injects PORT (default 10000, which the health check targets).
    # ONE worker x 8 threads. Threads still absorb slow provider calls (Wema/VTU do
    # network I/O in-request) so one can't stall every other request; --timeout
    # bounds a hung worker.
    #
    # One worker, not two, for two independent reasons:
    #   * MEMORY. Two workers each load Django plus the whole provider stack and
    #     then hold provider payloads (the bank list alone is ~499 entries). On the
    #     512MB free/starter tiers that OOMs — observed 2026-07-28, "Worker was sent
    #     SIGKILL! Perhaps out of memory?", which returns 503 to live callers.
    #   * CORRECTNESS. Without REDIS_URL the cache is per-process LocMem, and the
    #     BVN KYC handshake stores its pending code there — so with 2 workers the
    #     confirm request lands on the wrong process about half the time. Rate
    #     limits and login lockouts are likewise per-worker, doubling every cap.
    #
    # To go back to multiple workers: provision a Render Key Value instance, set
    # REDIS_URL, and raise this — in that order. REQUIRE_SHARED_CACHE exists to
    # enforce exactly that ordering.
    startCommand: "gunicorn zitch_api.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 8 --timeout 60"
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,api.zitch.ng"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.zitch.ng"
      # Bootstrap the back-office super admin. The free tier has no shell, so
      # build.sh running seed_ops on each deploy is the ONLY way in — and it is
      # gated on PASSWORD being non-empty, so leaving this blank means /portal/
      # has no operator account and every login is refused. Declared here (rather
      # than only in build.sh) so the fields are visible in the Render dashboard
      # instead of being invisible unless you read the build script.
      # Sign in at /portal/ with the USERNAME below, or with the EMAIL — both work.
      # Re-deploying with a new PASSWORD resets it, which is the recovery path
      # if it is ever lost.
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: ADMIN_TOKEN_TTL_HOURS
        value: "2"
      - key: ALLOW_BODY_ACCESS_TOKEN
        value: "false"
      - key: API_MAX_BODY_BYTES
        value: "4194304"
      - key: LLM_ALLOW_CUSTOM_ENDPOINT
        value: "false"
      - key: DJANGO_ADMIN_ENABLED
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "true"
      # Enrol super-admin/finance authenticators first, then set this true in the
      # dashboard. It is dashboard-owned so a Blueprint sync cannot lock every
      # operator out before the two-step enrolment is complete.
      - key: OPS_REQUIRE_MFA
        sync: false
      # Optional dedicated application-layer encryption key for operator TOTP
      # seeds. Blank falls back to DJANGO_SECRET_KEY; rotation accepts NEW,OLD.
      - key: TOTP_ENCRYPTION_KEYS
        sync: false
      - key: OPS_REQUIRE_DUAL_APPROVAL
        value: "true"
      # Origins allowed to call the API cross-origin (Expo web build /
      # browser-based dashboards). Native React Native does not enforce CORS,
      # so the mobile app is unaffected. Add new origins here as needed.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://zitch.ng,https://www.zitch.ng,http://localhost:8081,http://localhost:19006,http://localhost:19000"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      # Fill these in the Render dashboard (kept out of source):
      # Money rail is Wema / ALAT (see the WEMA_* block below) — funding (dedicated
      # NUBANs via BVN/NIN + OTP), payouts + name enquiry + balance, and BVN/NIN/vNIN
      # identity (Full KYC). Selfie/liveness + address + ID-document stay on Prembly;
      # cards on CARD_ISSUER (Wema card issuing not wired yet).
      # Optional diagnostics. WEMA_DIAG_TOKEN enables POST /wema-diagnose with a
      # Bearer token and JSON test input (never put BVN/NIN/OTP in a URL).
      # DIAG_TOKEN protects the VTU, SMS and callback diagnostics. All use bearer
      # headers; SMS and Wema identity inputs are POST JSON, never URL parameters.
      - key: DIAG_TOKEN
        sync: false
      - key: WEMA_DIAG_TOKEN
        sync: false
      # Virtual-card backend: "issuer" (generic CARD_ISSUER) — the sole backend; blank => issuer.
      - key: CARD_PROVIDER
        sync: false
      # Wallet FUND-IN rail: "wema" (the sole rail); blank => wema.
      - key: PAYMENT_PROVIDER
        sync: false
      # Bank-PAYOUT + recipient name-enquiry rail: "wema" (the sole rail); blank => wema.
      - key: PAYOUT_PROVIDER
        sync: false
      # BVN/NIN/vNIN KYC rail: "wema" (Wema Full KYC, the sole rail); blank => wema.
      # Selfie/liveness + address + ID-document are on Prembly.
      - key: KYC_PROVIDER
        sync: false
      - key: VAS_PROVIDER
        sync: false
      # ---------------------------------------------------------------------
      # Wema / ALAT — the SOLE money-movement + Nigeria-KYC rail. Wallet Services,
      # Card, Airtime, Account Upgrade, Remita and BNPL are distinct subscriptions;
      # set only the product keys the deployed features use, plus WEMA_SOURCE_ACCOUNT
      # (the pool NUBAN that funds payouts) and the live WEMA_BASE_URL,
      # and the WEMA_SECURITY_INFO scheme. Blank keys => mock; WEMA_SIMULATION=true
      # tests the flow without live keys (no real money). There is NO inbound-credit
      # webhook — deposits AND payout settlement are polled by the zitch-reconcile-wema
      # cron. See docs/wema-migration.md and utility/wema.py.
      # ---------------------------------------------------------------------
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_CARD_KEY
        sync: false
      - key: WEMA_AIRTIME_KEY
        sync: false
      - key: WEMA_BILLS_KEY
        sync: false
      - key: WEMA_UPGRADE_KEY
        sync: false
      - key: WEMA_KYC_KEY
        sync: false
      - key: WEMA_REMITA_KEY
        sync: false
      - key: WEMA_BNPL_KEY
        sync: false
      - key: WEMA_CARD_PRODUCT_KEY
        sync: false
      - key: WEMA_BNPL_MERCHANT_ID
        sync: false
      - key: WEMA_BNPL_AUTH_KEY
        sync: false
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      - key: WEMA_SECURITY_INFO
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      - key: WEMA_SIMULATION
        sync: false
      # Explicit second switch required by production_checks for a deliberately
      # isolated pre-launch environment. Remove/disable both before go-live.
      - key: ALLOW_PRODUCTION_SIMULATION
        sync: false
      # Bank-called callbacks. Wema PROFILES these URLs and the rails do not work
      # until it has them (account creation is refused without the Account Creation
      # URL; transactions fail auth without the Authentication URL). The token is the
      # shared secret in the URL path — the bank signs nothing.
      #   https://api.zitch.ng/webhooks/wema/{account,authorize,transaction,notification}/<TOKEN>
      - key: WEMA_CALLBACK_TOKEN
        sync: false
      - key: WEMA_CALLBACK_TOKEN_PREV
        sync: false
      - key: WEMA_CALLBACK_ENFORCE_IPS
        sync: false
      - key: WEMA_CALLBACK_IPS
        sync: false
      - key: WEMA_AUTH_MAX_AGE
        sync: false
      - key: WEMA_AUTH_REQUIRE_SECURITY_INFO
        sync: false
      - key: WEMA_VAS_STATUS_LEGEND
        sync: false
      - key: WEMA_BILLS_STATUS_LEGEND
        sync: false
      # Keep deterministic identity/OTP hashes stable independently of ordinary
      # Django secret-key rotation. Generate once; never rotate KYC_HASH_KEY unless
      # stored identity hashes are deliberately migrated at the same time.
      - key: DJANGO_KYC_HASH_KEY
        generateValue: true
      - key: DJANGO_OTP_HASH_KEY
        generateValue: true
      # Open banking — Mono (link bank, balance/transactions, DirectPay funding).
      # Blank SECRET_KEY => mock. Webhook: /api/banklink/webhook/. BASE_URL
      # defaults to https://api.withmono.com in code.
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_PUBLIC_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      # DEMO/PILOT ONLY — serves the SIMULATED bank-link flow (the app's
      # "Simulate" sheet) while no Mono keys are set: no real bank is contacted
      # and no real money moves, but the link flow is testable in a production
      # build. !! Set to "false" (or delete) the moment MONO_SECRET_KEY goes
      # live — leaving it on would keep serving fake links to real users.
      #
      # Dashboard-owned (sync: false), NOT a literal `value:`. A literal here is
      # Blueprint-owned, so every Blueprint sync force-restores it — and since
      # production_checks rejects any simulation flag without
      # ALLOW_PRODUCTION_SIMULATION, a committed "true" re-breaks the boot after
      # an operator has already turned it off in the dashboard. That failure
      # looks like the fix "not sticking", with nothing in the diff to explain
      # it. Every other provider flag is sync: false for the same reason.
      - key: MONO_SIMULATION
        sync: false
      # Optional pre-launch sign-in bypass. wema_preflight remains red until all
      # three are removed, so these cannot accidentally qualify as launch-ready.
      - key: TEST_OTP_PHONE
        sync: false
      - key: TEST_OTP_CODE
        sync: false
      - key: ALLOW_PRODUCTION_TEST_OTP
        sync: false
      - key: SIMULATE_DEPOSIT_TOKEN
        sync: false
      # VTU / bills — VTU.ng (v2). JWT Bearer auth, no IP whitelisting. Set
      # VTUNG_API_KEY (a long-lived token) OR VTUNG_USERNAME + VTUNG_PASSWORD
      # (auto-refreshed JWT).
      - key: VTUNG_API_KEY
        sync: false
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      # SMS / OTP — Termii, the only SMS rail. Blank TERMII_API_KEY => mock mode:
      # nothing is sent. Sending is one call, but DELIVERY also needs the sender ID
      # approved and DND-whitelisted — a carrier decision, not something a deploy fixes.
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_CHANNEL
        sync: false
      # Email / OTP fallback — Resend. Sends the same OTP alongside SMS so an
      # SMS routing issue (DND / sender ID block) never strands signup.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Zitch <no-reply@send.zitch.ng>"
      # Credit/debit alerts. Email is on by default (effectively free, and
      # expected on every movement). SMS is off by default: at Nigerian
      # per-message rates one alert per transaction is a real recurring cost, so
      # turning it on is a deliberate decision.
      - key: TXN_ALERTS_SMS
        value: "false"
      # KYC — Prembly (IdentityPass); also gates the large-transfer face check.
      - key: PREMBLY_API_KEY
        sync: false
      - key: PREMBLY_APP_ID
        sync: false
      # Virtual card issuer. The integration is generic (configurable base URL +
      # Bearer key, standard /cards endpoints) — set these for your provider
      # (e.g. Sudo, Maplerad, Bani). Until API_KEY is set the card feature fails
      # closed in production (no fake cards). BRAND defaults to Verve in code.
      - key: CARD_ISSUER_API_KEY
        sync: false
      - key: CARD_ISSUER_BASE_URL
        sync: false
      - key: CARD_ISSUER_BRAND
        sync: false
      # FX rail — Fincra (multi-currency Convert). Without these the Convert
      # screen fails closed in production. NGN/USD/GBP/CAD settle; CNY is
      # quote-only. BASE_URL defaults to https://api.fincra.com in code.
      - key: FINCRA_SECRET_KEY
        sync: false
      - key: FINCRA_BUSINESS_ID
        sync: false
      # WhatsApp channel — Meta Cloud API. Explicitly disabled until every live
      # credential is configured; production never falls back to an unsigned mock.
      # Set the same VERIFY_TOKEN in Meta and keep APP_SECRET enabled for HMAC.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_MODE
        sync: false
      - key: WHATSAPP_BASE_URL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      # Same 32+ byte value must be configured on the API and WhatsApp worker.
      # It encrypts queued inbound command text at rest.
      - key: WHATSAPP_QUEUE_KEY
        sync: false
      - key: WHATSAPP_QUEUE_KEY_PREV
        sync: false
      # New numbers open their account in the chat. The PIN still never appears
      # there: live deploys take it through the encrypted Flow, or create the
      # account without one for the app to set.
      - key: WHATSAPP_ALLOW_CHAT_SIGNUP
        value: "true"
      # Optional encrypted WhatsApp Flow used for transaction confirmation.
      - key: WHATSAPP_FLOW_ID
        sync: false
      - key: WHATSAPP_FLOW_PRIVATE_KEY
        sync: false
      - key: WHATSAPP_FLOW_PRIVATE_KEY_PASSPHRASE
        sync: false
      - key: WHATSAPP_FLOW_CTA
        sync: false
      # WhatsApp AI intent layer (optional). Blank => the deterministic router
      # handles everything; the model only proposes intents, never moves money.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      # Error reporting — blank keeps Sentry off (the SDK never initializes).
      # Set the project DSN here to activate it (PII is never sent).
      - key: SENTRY_DSN
        sync: false
      # Shared cache — REQUIRED because the API and WhatsApp worker are separate
      # processes and must see the same rate-limit/idempotency state.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zitch-cache
          property: connectionString

  # Shared ephemeral coordination for rate limits, short-lived verification state
  # and idempotency fallbacks. The durable WhatsApp queue itself is in Postgres, so
  # a cache eviction/restart cannot lose an inbound message or broadcast recipient.
  - type: keyvalue
    name: zitch-cache
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  # Durable WhatsApp queue consumer. A background worker has no free tier on
  # Render; syncing this Blueprint therefore requires an explicit paid-plan review.
  # Every secret is referenced from zitch-api, so key rotation stays atomic and a
  # worker can never accidentally use a different Flow-signing or queue key.
  - type: worker
    name: zitch-whatsapp-worker
    runtime: python
    rootDir: backend
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py whatsapp_worker --batch-size 50 --poll-seconds 0.5"
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: zitch-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_KYC_HASH_KEY
        fromService:
          type: web
          name: zitch-api
          envVarKey: DJANGO_KYC_HASH_KEY
      - key: DJANGO_OTP_HASH_KEY
        fromService:
          type: web
          name: zitch-api
          envVarKey: DJANGO_OTP_HASH_KEY
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zitch-cache
          property: connectionString
      - key: CARD_PROVIDER
        fromService: {type: web, name: zitch-api, envVarKey: CARD_PROVIDER}
      - key: PAYMENT_PROVIDER
        fromService: {type: web, name: zitch-api, envVarKey: PAYMENT_PROVIDER}
      - key: PAYOUT_PROVIDER
        fromService: {type: web, name: zitch-api, envVarKey: PAYOUT_PROVIDER}
      - key: VAS_PROVIDER
        fromService: {type: web, name: zitch-api, envVarKey: VAS_PROVIDER}
      - key: KYC_PROVIDER
        fromService: {type: web, name: zitch-api, envVarKey: KYC_PROVIDER}
      - key: WEMA_CHANNEL_ID
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_CHANNEL_ID}
      - key: WEMA_WALLET_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_WALLET_KEY}
      - key: WEMA_CARD_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_CARD_KEY}
      - key: WEMA_AIRTIME_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_AIRTIME_KEY}
      - key: WEMA_BILLS_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BILLS_KEY}
      - key: WEMA_UPGRADE_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_UPGRADE_KEY}
      - key: WEMA_KYC_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_KYC_KEY}
      - key: WEMA_REMITA_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_REMITA_KEY}
      - key: WEMA_BNPL_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BNPL_KEY}
      - key: WEMA_CARD_PRODUCT_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_CARD_PRODUCT_KEY}
      - key: WEMA_BNPL_MERCHANT_ID
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BNPL_MERCHANT_ID}
      - key: WEMA_BNPL_AUTH_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BNPL_AUTH_KEY}
      - key: WEMA_SOURCE_ACCOUNT
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SOURCE_ACCOUNT}
      - key: WEMA_SECURITY_INFO
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SECURITY_INFO}
      - key: WEMA_BASE_URL
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BASE_URL}
      - key: WEMA_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SIMULATION}
      - key: WEMA_VAS_STATUS_LEGEND
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_VAS_STATUS_LEGEND}
      - key: WEMA_BILLS_STATUS_LEGEND
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_BILLS_STATUS_LEGEND}
      - key: ALLOW_PRODUCTION_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: ALLOW_PRODUCTION_SIMULATION}
      - key: VTUNG_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: VTUNG_API_KEY}
      - key: VTUNG_USERNAME
        fromService: {type: web, name: zitch-api, envVarKey: VTUNG_USERNAME}
      - key: VTUNG_PASSWORD
        fromService: {type: web, name: zitch-api, envVarKey: VTUNG_PASSWORD}
      - key: TERMII_BASE_URL
        fromService: {type: web, name: zitch-api, envVarKey: TERMII_BASE_URL}
      - key: TERMII_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: TERMII_API_KEY}
      - key: TERMII_SENDER_ID
        fromService: {type: web, name: zitch-api, envVarKey: TERMII_SENDER_ID}
      - key: TERMII_CHANNEL
        fromService: {type: web, name: zitch-api, envVarKey: TERMII_CHANNEL}
      - key: RESEND_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: RESEND_API_KEY}
      - key: RESEND_FROM_EMAIL
        fromService: {type: web, name: zitch-api, envVarKey: RESEND_FROM_EMAIL}
      # The worker settles funding and reconciles VTU, so ledger rows reach
      # Successful in this process too — it has to alert on the same terms.
      - key: TXN_ALERTS_SMS
        fromService: {type: web, name: zitch-api, envVarKey: TXN_ALERTS_SMS}
      - key: PREMBLY_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: PREMBLY_API_KEY}
      - key: PREMBLY_APP_ID
        fromService: {type: web, name: zitch-api, envVarKey: PREMBLY_APP_ID}
      - key: CARD_ISSUER_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: CARD_ISSUER_API_KEY}
      - key: CARD_ISSUER_BASE_URL
        fromService: {type: web, name: zitch-api, envVarKey: CARD_ISSUER_BASE_URL}
      - key: CARD_ISSUER_BRAND
        fromService: {type: web, name: zitch-api, envVarKey: CARD_ISSUER_BRAND}
      - key: FINCRA_SECRET_KEY
        fromService: {type: web, name: zitch-api, envVarKey: FINCRA_SECRET_KEY}
      - key: FINCRA_BUSINESS_ID
        fromService: {type: web, name: zitch-api, envVarKey: FINCRA_BUSINESS_ID}
      - key: WHATSAPP_MODE
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_MODE}
      - key: WHATSAPP_BASE_URL
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_BASE_URL}
      - key: WHATSAPP_TOKEN
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_TOKEN}
      - key: WHATSAPP_PHONE_NUMBER_ID
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_PHONE_NUMBER_ID}
      - key: WHATSAPP_VERIFY_TOKEN
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_VERIFY_TOKEN}
      - key: WHATSAPP_APP_SECRET
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_APP_SECRET}
      - key: WHATSAPP_BUSINESS_NUMBER
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_BUSINESS_NUMBER}
      - key: WHATSAPP_QUEUE_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_QUEUE_KEY}
      - key: WHATSAPP_QUEUE_KEY_PREV
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_QUEUE_KEY_PREV}
      - key: WHATSAPP_ALLOW_CHAT_SIGNUP
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_ALLOW_CHAT_SIGNUP}
      - key: WHATSAPP_FLOW_ID
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_FLOW_ID}
      - key: WHATSAPP_FLOW_PRIVATE_KEY
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_FLOW_PRIVATE_KEY}
      - key: WHATSAPP_FLOW_PRIVATE_KEY_PASSPHRASE
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_FLOW_PRIVATE_KEY_PASSPHRASE}
      - key: WHATSAPP_FLOW_CTA
        fromService: {type: web, name: zitch-api, envVarKey: WHATSAPP_FLOW_CTA}
      - key: LLM_API_KEY
        fromService: {type: web, name: zitch-api, envVarKey: LLM_API_KEY}
      - key: LLM_MODEL
        fromService: {type: web, name: zitch-api, envVarKey: LLM_MODEL}
      - key: SENTRY_DSN
        fromService: {type: web, name: zitch-api, envVarKey: SENTRY_DSN}

  # Daily Fixed Save maturity sweep — pays out matured plans, including for
  # users who never open the app. REQUIRES A PAID RENDER PLAN: the cron service
  # type has no free tier, so on a free plan this block fails the Blueprint sync.
  # (Maturities also settle on access via /api/savings/list/, so the app stays
  # correct even without this cron.)
  - type: cron
    name: zitch-maturities
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 1 * * *"   # 01:00 UTC daily
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_maturities"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"   # single-process management command; no rate-limit state
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString

  # VTU reconciliation — settle purchases left PENDING by a provider timeout:
  # requery the aggregator by reference, then mark Successful (delivered) or
  # refund (definitively failed). Also requires a paid plan (cron has no free
  # tier). Runs every 10 minutes so stuck purchases clear quickly.
  - type: cron
    name: zitch-reconcile-vtu
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_vtu"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      # Both possible fulfillment rails are needed to requery the same provider
      # stamped on each PENDING row. Missing status credentials must never cause a
      # refund; code also fails safe to PENDING.
      - key: VTUNG_API_KEY
        sync: false
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_AIRTIME_KEY
        sync: false
      - key: WEMA_BILLS_KEY
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      # Rail safety mode is sourced from the web service so a cron cannot call
      # ALAT while customer-facing requests are deliberately simulated.
      - key: WEMA_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SIMULATION}
      - key: ALLOW_PRODUCTION_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: ALLOW_PRODUCTION_SIMULATION}
      - key: WEMA_VAS_STATUS_LEGEND
        sync: false
      - key: WEMA_BILLS_STATUS_LEGEND
        sync: false

  # Wema reconciliation — Wema exposes NO webhooks, so this poller does two jobs:
  # (1) FUNDING: sweep each Wema NUBAN's transaction history and credit inbound
  # deposits (idempotent on Wema's referenceId); (2) PAYOUTS: poll
  # ConfirmClientTransferStatus for any bank payout left PENDING and settle (success)
  # or reverse (failed) it. Without this, deposits never credit and a PENDING payout
  # sits debited forever. Requires a paid plan (cron has no free tier). Runs every 10
  # minutes. NOTE: crons are separate from the web service, so set the WEMA_* keys here.
  - type: cron
    name: zitch-reconcile-wema
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_wema"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      - key: WEMA_SECURITY_INFO
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      # Rail safety mode is sourced from the web service so a cron cannot call
      # ALAT while customer-facing requests are deliberately simulated.
      - key: WEMA_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SIMULATION}
      - key: ALLOW_PRODUCTION_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: ALLOW_PRODUCTION_SIMULATION}
      # Paging: reconcile_wema calls utility.alerts.alert on a crashed run or a
      # systemic gateway outage. That reaches Sentry only when SENTRY_DSN is set
      # in THIS cron's env (crons are separate processes from the web service).
      - key: SENTRY_DSN
        sync: false

  # Ledger <-> balance integrity check — recomputes every wallet from the
  # append-only ledger and fails (alerting via cron failure + AuditLog snapshot)
  # on any drift. Read-only apart from one AuditLog row per run. Also requires a
  # paid plan (cron has no free tier).
  - type: cron
    name: zitch-integrity-check
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "30 2 * * *"   # 02:30 UTC daily, after the maturity sweep
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py integrity_check --fail-nonzero"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      # Paging: integrity_check calls utility.alerts.alert on a mismatch, which
      # reaches Sentry only when SENTRY_DSN is set in this cron's env.
      - key: SENTRY_DSN
        sync: false

  # Ledger <-> BANK (Wema NUBAN) reconciliation — the EXTERNAL integrity check.
  # integrity_check compares the ledger to our own stored balance; this compares
  # the ledger to the real balance ALAT holds in each user's NUBAN, and pages
  # (Sentry) when the ledger EXCEEDS the bank (a possible float leak / double
  # credit). --fail-over also exits nonzero on that dangerous direction so Render
  # surfaces a cron failure even before Sentry is wired; a benign bank>ledger
  # delta (a deposit not yet swept by zitch-reconcile-wema) neither pages nor
  # fails. Read-only. Needs the WEMA_* balance-read keys + SENTRY_DSN. Only acts
  # when Wema is live (no-ops in sandbox/sim). Every 6 hours; tune as needed.
  - type: cron
    name: zitch-reconcile-balances
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reconcile_balances --fail-over"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      # Rail safety mode is sourced from the web service so a cron cannot call
      # ALAT while customer-facing requests are deliberately simulated.
      - key: WEMA_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SIMULATION}
      - key: ALLOW_PRODUCTION_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: ALLOW_PRODUCTION_SIMULATION}
      - key: SENTRY_DSN
        sync: false

  # DAILY SETTLEMENT STATEMENT — the whole float position, not per-wallet drift.
  # integrity_check and reconcile_balances both compare ONE wallet against ONE
  # counterpart. Neither can see the two pots that hold customer money but belong
  # to no user: the pool account (WEMA_SOURCE_ACCOUNT) and our VTU.ng provider
  # wallet. A VAS purchase debits the customer's ledger and OUR VTU wallet while
  # their NUBAN keeps the cash — per-wallet checks stay green while the VAS rail
  # drains. This command sums everything owed against everything held on every
  # rail and pages on a shortfall. Needs the VTU credentials as well as the WEMA
  # balance-read keys, or it reports an unreadable rail (which is itself an alert,
  # never a silent zero). Read-only. See docs/settlement-operating-model.md for
  # the thresholds and who owns the response.
  - type: cron
    name: zitch-settlement-report
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 6 * * *"   # 06:00 UTC = 07:00 Lagos, before the business day
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py settlement_report --fail-on-breach"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: WEMA_CHANNEL_ID
        sync: false
      - key: WEMA_WALLET_KEY
        sync: false
      - key: WEMA_BASE_URL
        sync: false
      # Rail safety mode is sourced from the web service so a cron cannot call
      # ALAT while customer-facing requests are deliberately simulated.
      - key: WEMA_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: WEMA_SIMULATION}
      - key: ALLOW_PRODUCTION_SIMULATION
        fromService: {type: web, name: zitch-api, envVarKey: ALLOW_PRODUCTION_SIMULATION}
      - key: WEMA_SOURCE_ACCOUNT
        sync: false
      # The VAS asset rail. Without these the provider wallet reads as UNREADABLE
      # and the position is reported advisory rather than authoritative.
      - key: VTUNG_API_KEY
        sync: false
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  # AML TRANSACTION MONITORING. The compliance QA response tells a regulator we monitor
  # for "threshold breaches (₦5M+), rapid velocity, structuring" and file SARs with NFIU
  # "within 30 days of detection". This is the code behind that: it opens cases for those
  # patterns and — the part that matters — goes RED when an open case passes its 30-day
  # deadline, because an unfiled SAR past its deadline is a regulatory breach and is
  # otherwise invisible. Read-only over the ledger; it never blocks a transaction (see
  # docs/compliance-operations.md for why, and for where the code and the policy wording
  # differ). Needs only the database and SENTRY_DSN.
  - type: cron
    name: zitch-aml-scan
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 5 * * *"   # 05:00 UTC = 06:00 Lagos, before the settlement report
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py aml_scan --fail-on-overdue"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_REQUIRE_SHARED_CACHE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zitch-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false

databases:
  - name: zitch-db
    plan: basic-256mb
    # Application services use the private connection string above. Refuse every
    # public Postgres source; the current live database still needs this applied
    # manually or by an explicitly reviewed Blueprint sync.
    ipAllowList: []
