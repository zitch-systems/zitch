# Standalone Blueprint. Never sync this into the repository's root Blueprint.
# Activation requires separately supplied secret values and a bank-approved KYC path.
databases:
  - name: zitch-vas-validation-db
    databaseName: zitch_vas_validation
    user: zitch_vas_validation
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: zitch-vas-validation-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: codex/vas-isolated-e2e
    rootDir: incubator/wema_vas
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn vas_harness.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 30
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.14'
      - key: WEMA_VAS_MODE
        value: validation
      - key: WEMA_VAS_ENABLED
        value: 'false'
      - key: WEMA_VAS_PREFIX
        value: '711'
      - key: WEMA_VAS_ALLOWED_HOSTS
        value: zitch-vas-validation-api.onrender.com
      - key: WEMA_VAS_TRUST_TLS_PROXY
        value: 'true'
      - key: WEMA_VAS_DJANGO_SECRET
        generateValue: true
      - key: WEMA_VAS_DB_CONNECTION
        fromDatabase:
          name: zitch-vas-validation-db
          property: connectionString
