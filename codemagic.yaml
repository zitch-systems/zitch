# Codemagic CI build for the Zitch Expo (React Native) Android app.
#
# Produces an installable APK with no EAS/Expo build credits. The Expo project
# lives at the repository root, so this file sits at the root too.
#
# The GitHub Actions Android APK workflow owns tagged preview releases. Keep
# this Codemagic workflow as a manual fallback: "Start new build" → "android-apk".
workflows:
  android-apk:
    name: Zitch Android APK (preview)
    # Codemagic's free plan runs on mac_mini_m2 (500 min/month). Android builds
    # fine here — the Android SDK is preinstalled on the macOS image. Switch to
    # linux_x2 if/when your plan includes Linux instances (cheaper for Android).
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      vars:
        # Mirrors eas.json's "preview" profile so the app talks to the live API.
        EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate the native android/ project)
        script: npx expo prebuild --platform android --clean
      - name: Build release APK
        # Expo's prebuild template signs the release variant with the debug key,
        # so this APK is installable for testing/sideloading out of the box.
        # For a Play Store upload, configure Android code signing in Codemagic
        # and switch to `assembleRelease`/`bundleRelease` with that keystore.
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Verify installable test APK
        script: |
          python3 scripts/verify-android-apk.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --keystore android/app/debug.keystore --signing preview \
            --revision "$(git rev-parse HEAD)" --metadata android/apk-build-info.json
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/apk-build-info.json
    # Manual fallback only. There is intentionally no `triggering:` block here,
    # so a main-branch push cannot duplicate GitHub's automatic preview build.
    # Keep the changeset scope as a guardrail if automation is restored later.
    when:
      changeset:
        includes:
          - 'app'
          - 'components'
          - 'lib'
          - 'assets'
          - 'package.json'
          - 'package-lock.json'
          - 'app.json'
          - 'eas.json'
          - 'codemagic.yaml'
    # Optional — email the APK link when the build finishes:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true

  android-production-aab:
    name: Zitch Android production AAB
    instance_type: linux_x2
    max_build_duration: 60
    # Manual fallback only; arbitrary tags must not expose production signing.
    environment:
      node: 20
      java: 17
      android_signing:
        - zitch-production-upload
      vars:
        EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
        ZITCH_CONFIGURE_UPLOAD_SIGNING: "true"
        ZITCH_REQUIRE_UPLOAD_KEY: "true"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Require the main branch for production signing
        script: |
          test "$CM_BRANCH" = main || { echo 'Production signing requires main.' >&2; exit 1; }
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean
      - name: Build signed production AAB
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          cd android
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_STORE_FILE="$CM_KEYSTORE_PATH"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_ZITCH_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD"
          export ORG_GRADLE_PROJECT_ZITCH_REQUIRE_UPLOAD_KEY=true
          ./gradlew bundleRelease --no-daemon
      - name: Verify signed AAB
        script: |
          export ZITCH_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export ZITCH_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS"
          scripts/verify-android-signing.sh android/app/build/outputs/bundle/release/app-release.aab "$CM_KEYSTORE_PATH"
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
