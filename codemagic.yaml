# Codemagic CI build for the Zitch Expo (React Native) Android app.
#
# Produces an installable APK with no EAS/Expo build credits. The Expo project
# lives at the repository root, so this file sits at the root too.
#
# Builds automatically when app code lands on main (see `triggering:` below), and
# can be started anytime from the dashboard: "Start new build" → "android-apk".
workflows:
  android-apk:
    name: Zitch Android APK (preview)
    # Codemagic's free plan runs on mac_mini_m2 (500 min/month). Android builds
    # fine here — the Android SDK is preinstalled on the macOS image. Switch to
    # linux_x2 if/when your plan includes Linux instances (cheaper for Android).
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      vars:
        # Preview APK target. Keep secrets out of EXPO_PUBLIC_* variables because
        # Expo inlines them into the app bundle.
        EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: |
          npm install --global npm@11.6.2
          npm ci
      - name: Lint app source
        script: npm run lint
      - name: Validate TypeScript
        script: npm run typecheck
      - name: Run app unit tests
        script: npm run test:ci
      - name: Audit production dependencies
        # Block critical production advisories. High/moderate transitive build-tool
        # advisories remain visible in the log without preventing preview APKs.
        script: npm audit --omit=dev --audit-level=critical
      - name: Validate Expo project
        script: |
          npm run doctor
          npx expo install --check
          npx expo config --type public
      - name: Expo prebuild (generate the native android/ project)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        # Expo's prebuild template signs this preview release with the debug key,
        # so it is installable for testing/sideloading. For Play Store or external
        # distribution, configure Android code signing in Codemagic first.
        script: |
          cd android
          ./gradlew assembleRelease --stacktrace
      - name: Verify APK artifact
        script: |
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK was not produced"
            exit 1
          fi
          ls -lh "$APK_PATH"
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/reports/**
    # Build on every push to main, AND on demand from the dashboard
    # ("Start new build" → android-apk).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    # Email the APK download link when a build finishes.
    publishing:
      email:
        recipients:
          - teyokensax1@gmail.com
        notify:
          success: true
          failure: true

