# Codemagic CI build for the Zitch Expo (React Native) Android app.
#
# Produces an installable APK with no EAS/Expo build credits. The Expo project
# lives at the repository root, so this file sits at the root too.
#
# Builds automatically when app code lands on main (see `triggering:` below), and
# can be started anytime from the dashboard: "Start new build" → "android-apk".
workflows:
  android-apk:
    name: Zitch Android APK (preview)
    # Codemagic's free plan runs on mac_mini_m2 (500 min/month). Android builds
    # fine here — the Android SDK is preinstalled on the macOS image. Switch to
    # linux_x2 if/when your plan includes Linux instances (cheaper for Android).
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      vars:
        # Mirrors eas.json's "preview" profile so the app talks to the live API.
        EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate the native android/ project)
        script: npx expo prebuild --platform android --clean
      - name: Build release APK
        # Expo's prebuild template signs the release variant with the debug key,
        # so this APK is installable for testing/sideloading out of the box.
        # For a Play Store upload, configure Android code signing in Codemagic
        # and switch to `assembleRelease`/`bundleRelease` with that keystore.
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    # Auto-build when app code lands on main. Trigger manually anytime from the
    # dashboard ("Start new build" → android-apk). The changeset filter that
    # avoids burning free build minutes on irrelevant changes lives in the
    # workflow-level `when:` below.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        # Build the v2 design branch too, so the redesign produces a sideloadable
        # APK before it merges to main.
        - pattern: new-design-files-v2
          include: true
    # `when` is a workflow-level key (sibling of `triggering`, not a child of
    # it). With a changeset filter it skips webhook-triggered builds whose
    # changes don't touch any of these paths, so landing/docs/backend-only
    # changes don't burn free build minutes.
    when:
      changeset:
        includes:
          - 'app'
          - 'components'
          - 'lib'
          - 'assets'
          - 'package.json'
          - 'package-lock.json'
          - 'app.json'
          - 'eas.json'
          - 'codemagic.yaml'
    # Optional — email the APK link when the build finishes:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true

  android-production-aab:
    name: Zitch Android production AAB
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    environment:
      node: 20
      java: 17
      android_signing:
        - zitch-production-upload
      vars:
        EXPO_PUBLIC_API_URL: "https://api.zitch.ng"
        ZITCH_CONFIGURE_UPLOAD_SIGNING: "true"
        ZITCH_REQUIRE_UPLOAD_KEY: "true"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean
      - name: Build signed production AAB
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          cd android
          ./gradlew bundleRelease --no-daemon \
            -PZITCH_UPLOAD_STORE_FILE="$CM_KEYSTORE_PATH" \
            -PZITCH_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PZITCH_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS" \
            -PZITCH_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD" \
            -PZITCH_REQUIRE_UPLOAD_KEY=true
      - name: Verify signed AAB
        script: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/zitch-jarsigner.txt
          ! grep -q 'CN=Android Debug' /tmp/zitch-jarsigner.txt
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
